<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>/*__UI_CSS__*/</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div id="top"><div class="row">
    <div class="panel field"><label for="qNum">Nº</label><input id="qNum" class="num" placeholder="G7, E5, ilha ou mostruário" autocomplete="off"></div>
    <div class="panel field"><label for="qProd">Produto</label><input id="qProd" placeholder="nome, código ou 2 termos" autocomplete="off"></div>
    <button class="btn" id="bVista" title="Voltar ao enquadramento inicial">⟲ Vista</button>
    <button class="btn" id="bBoneco" title="Quantos bonecos caminham pela loja">🚶 1</button>
    <button class="btn" id="bCaixas" title="Mostrar ou esconder as caixas dos produtos nas prateleiras">📦 Caixas</button>
    <span id="msg"></span>
  </div></div>
  <div id="info" class="panel"></div>
  <div id="legend" class="panel">
    <span><i style="background:#4caf50"></i>Gôndola</span>
    <span><i style="background:#4a93d8"></i>Estante / expositor</span>
    <span><i style="background:#2fbf5f"></i>Ilha de paletes</span>
    <span><i style="background:#8a6a42"></i>Mostruário (palete)</span>
    <span><i style="background:#1f9350"></i><i style="background:#8a6a52;margin-left:-4px"></i>Balcão</span>
    <span><i style="background:#e87722"></i>Caixa do produto buscado</span>
    <span><i style="background:rgba(46,158,79,.55);border-color:#2e9e4f"></i>Produto buscado (marca no chão)</span>
    <span><i style="background:transparent;border:2px solid #e87722"></i>Selecionada</span>
  </div>
  <div id="stats" class="panel"></div>
  <div id="tip"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
const D = /*__DADOS__*/null;

const ORANGE = 0xe87722, GREEN = 0x2e9e4f;
// Cores reais do Gondolas: gôndola verde, estante azul, balcão verde-escuro com tampo de mármore marrom.
const C_GOND = 0x4caf50, C_EST = 0x4a93d8, C_ILHA = 0x2fbf5f, C_MADEIRA = 0x8a6a42, C_BALCAO = 0x1f9350, C_TAMPO = 0x8a6a52, C_PAREDE = 0xd2cdc2, C_FADE = 0xe9e6df;
const state = { sel: null, matched: new Set(), bonecos: 1, caixas: true };
const fmt = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 });
const $ = (id) => document.getElementById(id);
const fold = (s) => (s || "").toString().normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const normCod = (c) => (c || "").trim().toUpperCase();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LW = D.loja.w, LH = D.loja.h, PE = D.loja.parede, PH = D.loja.paredeH, EH = D.estanteH;

// ── Three.js ────────────────────────────────────────────────────────────────
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeebe4);
const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 400);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47; controls.minDistance = 3; controls.maxDistance = 70;

scene.add(new THREE.HemisphereLight(0xffffff, 0xdcd6c9, 0.74));
const sun = new THREE.DirectionalLight(0xffffff, 0.54);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
const cx0 = LW / 2, cz0 = LH / 2, R0 = Math.hypot(LW, LH) / 2 + 3;
sun.target.position.set(cx0, 0, cz0);
sun.position.set(cx0 - 0.55 * R0, 1.35 * R0, cz0 + 0.8 * R0);
Object.assign(sun.shadow.camera, { left: -R0, right: R0, top: R0, bottom: -R0, near: 1, far: 6 * R0 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);

const matCache = {};
const getMat = (hex) => (matCache[hex] ||= new THREE.MeshStandardMaterial({ color: hex, roughness: 0.92, metalness: 0 }));
const lerpHex = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), t).getHex();
const geoCache = {};
const boxGeo = (w, h, d) => (geoCache[[w, h, d].map((v) => v.toFixed(4)).join()] ||= new THREE.BoxGeometry(w, h, d));

// Laje (chão) + piso de ladrilhos + paredes
const laje = new THREE.Mesh(new THREE.BoxGeometry(LW + 4, 0.2, LH + 4), getMat(0xf8f6f1));
laje.position.set(LW / 2, -0.101, LH / 2); laje.receiveShadow = true; scene.add(laje);
{
  const nx = Math.max(1, Math.round((LW - 2 * PE) / 1)), nz = Math.max(1, Math.round((LH - 2 * PE) / 1));
  const c = document.createElement("canvas"); c.width = nx * 64; c.height = nz * 64;
  const g = c.getContext("2d");
  g.fillStyle = "#e1dfd9"; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = "rgba(0,0,0,.09)"; g.lineWidth = 2;
  for (let i = 0; i <= nx; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, c.height); g.stroke(); }
  for (let j = 0; j <= nz; j++) { g.beginPath(); g.moveTo(0, j * 64); g.lineTo(c.width, j * 64); g.stroke(); }
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const piso = new THREE.Mesh(new THREE.PlaneGeometry(LW - 2 * PE, LH - 2 * PE), new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
  piso.rotation.x = -Math.PI / 2; piso.position.set(LW / 2, 0.002, LH / 2); piso.receiveShadow = true; scene.add(piso);
}
function parede(x0, x1, z0, z1) {
  const m = new THREE.Mesh(boxGeo(x1 - x0, PH, z1 - z0), getMat(C_PAREDE));
  m.position.set((x0 + x1) / 2, PH / 2, (z0 + z1) / 2); m.castShadow = m.receiveShadow = true; scene.add(m);
}
parede(0, PE, 0, LH); parede(0, LW, 0, PE); parede(0, LW, LH - PE, LH); parede(LW - PE, LW, 0, LH);

// ── Estruturas ──────────────────────────────────────────────────────────────
// Cada parte guarda o "papel" (cor/poste/testeira/tampo) para a recoloração (destaque da busca).
function novaEstrutura() { return { group: new THREE.Group(), parts: [] }; }
function caixa(S, x0, x1, y0, y1, z0, z1, role) {
  const m = new THREE.Mesh(boxGeo(x1 - x0, y1 - y0, z1 - z0), getMat(0xffffff));
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.castShadow = m.receiveShadow = true;
  S.group.add(m); S.parts.push({ m, role });
}
const SH = 0.013;                                   // espessura da prateleira

function montarGondola(S, it) {
  const e = D.gondola.escala;
  for (const [r, yc, h] of D.gondola.prat) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r * e, r * e, h * e, 6), getMat(0xffffff));
    m.rotation.y = Math.PI / 2; m.position.set(it.x, yc * e, it.z); m.castShadow = m.receiveShadow = true;
    S.group.add(m); S.parts.push({ m, role: "cor" });
  }
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.28 * e, 0.28 * e, (3.30 - 0.85) * e, 6), getMat(0xffffff));
  p.rotation.y = Math.PI / 2; p.position.set(it.x, ((0.85 + 3.30) / 2) * e, it.z); p.castShadow = true;
  S.group.add(p); S.parts.push({ m: p, role: "cor" });
  S.h = (3.43 + 0.26 / 2) * e;
}
function montarEstante(S, it, cx = it.x, cz = it.z, w = it.w, d = it.d, nNiveis = 5, h = EH) {
  const hw = w / 2, hd = d / 2, pW = 0.04, pD = 0.028;
  for (const [px, pz] of [[cx - hw + pW, cz - hd + pD], [cx + hw - pW, cz - hd + pD], [cx - hw + pW, cz + hd - pD], [cx + hw - pW, cz + hd - pD]])
    caixa(S, px - pW, px + pW, 0, h, pz - pD, pz + pD, "poste");
  for (let i = 0; i < nNiveis; i++) {
    const y = (i * (h - SH)) / (nNiveis - 1);
    caixa(S, cx - hw + pW * 2, cx + hw - pW * 2, y, y + SH, cz - hd + pD, cz + hd - pD, "cor");
  }
  S.h = h;
}
function montarEdr300x3(S, it) {
  const n = 3, alongZ = it.d >= it.w;
  for (let k = 0; k < n; k++) {
    if (alongZ) montarEstante(S, it, it.x, it.z - it.d / 2 + (it.d * (k + 0.5)) / n, it.w, it.d / n, 6);
    else montarEstante(S, it, it.x - it.w / 2 + (it.w * (k + 0.5)) / n, it.z, it.w / n, it.d, 6);
  }
}
function montarParede(S, it) {
  const hw = it.w / 2, hd = it.d / 2, h = 0.55, nN = 6, nS = 6;
  for (let i = 0; i <= nS; i++) {
    const z = it.z - hd + (it.d * i) / nS;
    caixa(S, it.x - hw, it.x - hw + 0.06, 0, h + 0.04, z - 0.02, z + 0.02, "poste");
  }
  for (let i = 0; i < nN; i++) {
    const y = (i * (h - SH)) / (nN - 1);
    caixa(S, it.x - hw + 0.04, it.x + hw, y, y + SH, it.z - hd, it.z + hd, "cor");
  }
  S.h = h + 0.04;
}
function montarExpositor(S, it) {
  const hw = it.w / 2, hd = it.d / 2, h = EH, x0 = it.x - hw, x1 = it.x + hw, z0 = it.z - hd, z1 = it.z + hd;
  caixa(S, x0, x1, 0, 0.10, z0, z1, "cor");
  if (it.kind === "magnojet") {
    caixa(S, x0, x1, 0.10, h * 0.82, z0, z0 + 0.05, "cor");
    // testeira inclinada (rampa)
    const g = new THREE.BufferGeometry();
    const v = [x0, h * 0.82, z0 + 0.05, x1, h * 0.82, z0 + 0.05, x1, h, z0 + 0.18, x0, h, z0 + 0.18];
    g.setAttribute("position", new THREE.Float32BufferAttribute(v, 3)); g.setIndex([0, 1, 2, 0, 2, 3, 0, 2, 1, 0, 3, 2]);
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, getMat(0xffffff)); m.castShadow = true; S.group.add(m); S.parts.push({ m, role: "test" });
  } else if (it.kind === "nellore") {
    caixa(S, x0, x1, 0.10, h * 0.80, z0, z0 + 0.05, "cor");
    caixa(S, x0, x1, h * 0.80, h, z0, z0 + 0.14, "test");
  } else {                                           // monitor: prateleiras escalonadas
    caixa(S, x0, x1, 0.10, h * 0.80, z0, z0 + 0.05, "cor");
    for (const [f, prof] of [[0.30, 0.55], [0.48, 0.40], [0.66, 0.25]]) caixa(S, x0, x1, h * f, h * f + 0.02, z0, z0 + it.d * prof, "cor");
    caixa(S, x0, x1, h * 0.80, h, z0, z0 + 0.14, "test");
  }
  S.h = h;
}
function montarBalcao(S, it) {
  const hw = it.w / 2, hd = it.d / 2, h = 0.5, tT = h * 0.07, corpoH = h - tT, esp = 0.18;
  const z0 = it.z - hd, z1 = it.z + hd, bordas = [z0];
  for (const c of [0.215, 0.785]) { const zc = z0 + it.d * c; bordas.push(zc - 0.59, zc + 0.59); }
  bordas.push(z1);
  for (let i = 0; i < bordas.length - 1; i++) {
    const topo = i % 2 ? corpoH * (1 - 0.43) : corpoH;
    caixa(S, it.x - esp / 2, it.x + esp / 2, 0, topo, bordas[i], bordas[i + 1], "cor");
    caixa(S, it.x - hw, it.x + hw, topo, topo + tT, bordas[i], bordas[i + 1], "tampo");
  }
  S.h = h;
}

// Ilha de paletes: 12 placas baixas de tapume (2 × 6) com a fresta entre elas e o número do espaço
// (1–12) pintado em cada uma — de 2 em 2, do caixa para a entrada, esquerda antes da direita.
function montarIlha(S, it) {
  const nc = D.ilha.colunas, nf = D.ilha.espacos / nc, h = 0.12, f = 0.03;
  const pw = it.w / nc, pd = it.d / nf, x0 = it.x - it.w / 2, z0 = it.z - it.d / 2;
  for (let e = 0; e < D.ilha.espacos; e++) {
    const c = e % nc, r = Math.floor(e / nc);
    const ax = x0 + c * pw, az = z0 + r * pd;
    caixa(S, ax + f / 2, ax + pw - f / 2, 0, h, az + f / 2, az + pd - f / 2, "cor");
    const cv = document.createElement("canvas"); cv.width = cv.height = 128;
    const g = cv.getContext("2d");
    g.fillStyle = "rgba(11,38,20,.8)"; g.font = "bold 64px system-ui, Segoe UI, Arial, sans-serif";
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(String(e + 1), 64, 68);
    const t = new THREE.CanvasTexture(cv); t.anisotropy = 4;
    const lado = Math.min(pw, pd) * 0.6;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(lado, lado), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.set(ax + pw / 2, h + 0.003, az + pd / 2); m.renderOrder = 2;
    S.group.add(m);
  }
  S.h = h;
}

// Mostruário: palete de madeira baixo (PBR, 0,144 m) — três travessas escuras embaixo e o tampo em
// 5 tábuas correndo ao longo da parede (Z), com fresta entre elas.
function montarMostruario(S, it) {
  const h = 0.144, tabua = 0.022, x0 = it.x - it.w / 2, z0 = it.z - it.d / 2, z1 = it.z + it.d / 2;
  for (const c of [0.05, it.w / 2, it.w - 0.05]) caixa(S, x0 + c - 0.05, x0 + c + 0.05, 0, h - tabua, z0, z1, "poste");
  const n = 5, f = 0.015, w = (it.w - f * (n - 1)) / n;
  for (let i = 0; i < n; i++) { const a = x0 + i * (w + f); caixa(S, a, a + w, h - tabua, h, z0, z1, "cor"); }
  S.h = h;
}

// Expositor de Madeira: 3 degraus maciços encostados no balcão (x baixo), descendo para o corredor (+X),
// com um tampo mais claro em cada piso.
function montarMadeira(S, it) {
  const h = 0.45, n = 3, tT = 0.02, x0 = it.x - it.w / 2, z0 = it.z - it.d / 2, z1 = it.z + it.d / 2;
  for (let k = 0; k < n; k++) {
    const xf = x0 + (it.w * (n - k)) / n, y0 = (h * k) / n, y1 = (h * (k + 1)) / n;
    caixa(S, x0, xf, y0, y1 - tT, z0, z1, "cor");
    caixa(S, x0, xf, y1 - tT, y1, z0, z1, "test");          // "test" = a cor base clareada
  }
  S.h = h;
}

const estruturas = [];                              // {it, S, hit, label, base}
const labels = [];
function makeLabelTex(txt, estilo) {
  const k = txt + "|" + estilo;
  return (makeLabelTex.c ||= {})[k] ||= (() => {
    const c = document.createElement("canvas"); c.width = 192; c.height = 80;
    const g = c.getContext("2d");
    const cores = { n: ["rgba(255,255,255,.93)", "#2b2a27", "#d4d0c6"], h: ["#2e9e4f", "#fff", "#2e9e4f"], s: ["#e87722", "#fff", "#e87722"] }[estilo];
    g.fillStyle = cores[0]; g.strokeStyle = cores[2]; g.lineWidth = 3;
    g.beginPath(); g.roundRect ? g.roundRect(6, 8, 180, 64, 22) : g.rect(6, 8, 180, 64); g.fill(); g.stroke();
    g.fillStyle = cores[1]; g.font = "bold 40px system-ui, Segoe UI, Arial, sans-serif";
    const larg = g.measureText(txt).width;              // "Mostruário" não cabe em 40px: encolhe até caber
    if (larg > 160) g.font = `bold ${Math.floor(40 * 160 / larg)}px system-ui, Segoe UI, Arial, sans-serif`;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(txt, 96, 42);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
  })();
}
for (const it of D.itens) {
  const S = novaEstrutura();
  if (it.kind === "gondola") montarGondola(S, it);
  else if (it.kind === "edr300x3") montarEdr300x3(S, it);
  else if (it.kind === "edr300") montarEstante(S, it, it.x, it.z, it.w, it.d, 6);
  else if (it.kind === "parede") montarParede(S, it);
  else if (it.kind === "balcao") montarBalcao(S, it);
  else if (it.kind === "ilha") montarIlha(S, it);
  else if (it.kind === "mostruario") montarMostruario(S, it);
  else if (it.kind === "madeira") montarMadeira(S, it);
  else if (["magnojet", "nellore", "monitor"].includes(it.kind)) montarExpositor(S, it);
  else montarEstante(S, it);
  scene.add(S.group);
  const base = it.kind === "gondola" ? C_GOND : it.kind === "balcao" ? C_BALCAO : it.kind === "ilha" ? C_ILHA : it.kind === "mostruario" || it.kind === "madeira" ? C_MADEIRA : C_EST;
  // alvo do raio: caixa envolvente da estrutura (o balcão é só visual, como no app)
  let hit = null;
  if (it.kind !== "balcao") {
    const hw = (it.kind === "gondola" ? D.gondola.r * 2 : it.w) / 2 + 0.08, hd = (it.kind === "gondola" ? D.gondola.r * 2 : it.d) / 2 + 0.08;
    hit = new THREE.Mesh(new THREE.BoxGeometry(hw * 2, S.h + 0.1, hd * 2), new THREE.MeshBasicMaterial({ visible: false }));
    hit.position.set(it.x, (S.h + 0.1) / 2, it.z); hit.userData.idx = estruturas.length; scene.add(hit);
  }
  const lab = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeLabelTex(it.rot, "n"), transparent: true, depthTest: false }));
  lab.renderOrder = 10; lab.userData.base = 1; lab.position.set(it.x, S.h + 0.38, it.z); scene.add(lab); labels.push(lab);
  const hw2 = (it.kind === "gondola" ? D.gondola.r * 2 : it.w) + 0.4, hd2 = (it.kind === "gondola" ? D.gondola.r * 2 : it.d) + 0.4;
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(hw2, hd2), new THREE.MeshBasicMaterial({ color: GREEN, transparent: true, opacity: 0.55, depthWrite: false }));
  halo.rotation.x = -Math.PI / 2; halo.position.set(it.x, 0.012, it.z); halo.visible = false; halo.renderOrder = 1; scene.add(halo);
  estruturas.push({ it, S, hit, label: lab, base, matched: false, halo });
}
const hits = estruturas.filter((e) => e.hit).map((e) => e.hit);

// ── Caixas dos produtos ─────────────────────────────────────────────────────
// Cada linha de gondola_layout / estante_layout vira uma caixa na prateleira, na cor que o app gravou
// (cor_hex, por categoria). Gôndola: pos_x/pos_z do app (escala da cena de detalhe) × escala do mapa.
// Estantes e expositores: o app tem uma grade própria por modelo; aqui a posição é proporcional —
// coluna e slot dividem o comprimento, o nível escolhe a prateleira. Uma InstancedMesh só para todas.
const caixas = [];                                  // {x, y, z, w, h, d, cor, c, ei}
function vagaEstante(it, cx, cz, w, d, nNiveis, h, k, maxCol, maxSlot) {
  const alongZ = d >= w, L = alongZ ? d : w, P = alongZ ? w : d;
  const nc = Math.max(3, maxCol + 1), ns = Math.max(4, maxSlot + 1);
  const cel = L / nc, u = -L / 2 + cel * (Math.min(k.col, nc - 1) + (Math.min(k.s, ns - 1) + 0.5) / ns);
  const gap = (h - SH) / (nNiveis - 1), bw = Math.min(cel / ns * 0.82, 0.16), bh = Math.min(gap * 0.62, 0.16), bd = Math.min(P * 0.45, 0.16);
  const y = Math.min(k.niv, nNiveis - 1) * gap + SH;
  return alongZ ? { x: cx, z: cz + u, y, w: bd, h: bh, d: bw } : { x: cx + u, z: cz, y, w: bw, h: bh, d: bd };
}
function vagaExpositor(it, k, nNiveis, maxCol) {
  // caixas encostadas no painel de fundo (lado -Z), uma faixa por nível, colunas ao longo da largura
  const nc = Math.max(5, maxCol + 1), cel = it.w / nc, y0 = 0.10, y1 = EH * 0.80;
  const gap = (y1 - y0) / nNiveis, bw = Math.min(cel * 0.75, 0.12), bh = Math.min(gap * 0.7, 0.12);
  return { x: it.x - it.w / 2 + cel * (Math.min(k.col, nc - 1) + 0.5), y: y0 + Math.min(k.niv, nNiveis - 1) * gap,
           z: it.z - it.d / 2 + 0.05 + 0.06, w: bw, h: bh, d: 0.1 };
}
function vagaCaixa(it, k, maxCol, maxSlot) {
  if (it.kind === "gondola") {
    const e = D.gondola.escala, [, yc, hh] = D.gondola.prat[k.a], b = 0.40 * e;

  const h = e.S.h, w = e.it.kind === "gondola" ? D.gondola.r * 2 : e.it.w, d = e.it.kind === "gondola" ? D.gondola.r * 2 : e.it.d;
  hoverBox.scale.set(w + 0.1, h + 0.05, d + 0.1); hoverBox.position.set(e.it.x, h / 2, e.it.z); hoverBox.visible = true;
  tip.style.display = "block";
  const W = $("wrap").clientWidth;
  tip.style.left = Math.min(ultimoMouse.x + 16, W - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.max(ultimoMouse.y - tip.offsetHeight - 12, 6) + "px";
  dirty = true;
}
canvas.addEventListener("click", () => {
  if (moveu) return;
  const e = acharEstrutura();
  if (e) { $("qNum").value = e.it.rot; selecionar(e.it.rot, false); }
});

// ── Loop ────────────────────────────────────────────────────────────────────
let dirty = true, ultimo = performance.now();
controls.addEventListener("change", () => { dirty = true; });
let primeiroTamanho = true;
function redimensionar() {
  const w = $("wrap").clientWidth, h = $("wrap").clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (primeiroTamanho) { primeiroTamanho = false; enquadrarLoja(false); }   // enquadra com o tamanho real
  dirty = true;
}
new ResizeObserver(redimensionar).observe($("wrap"));
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const tmpV = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - ultimo) / 1000, 0.05); ultimo = now;
  if (tween) {
    const k = Math.min((now - tween.t0) / tween.dur, 1), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t_0, tween.t1, e);
    if (k >= 1) tween = null; dirty = true;
  }
  if (state.bonecos > 0) { andarBonecos(dt); dirty = true; }
  for (const s of labels) {
    const d = camera.position.distanceTo(s.getWorldPosition(tmpV)), k = THREE.MathUtils.clamp(d * 0.03, 0.6, 1.5) * s.userData.base;
    s.material.visible = window.__rotulosOn === true;
    if (Math.abs(s.scale.x - k) > 1e-3) { s.scale.set(k, k / 2.4, 1); dirty = true; }
  }
  if (selGrupo.visible) { selFill.material.opacity = 0.28 + 0.14 * Math.sin(now / 280); dirty = true; }
  if (controls.update()) dirty = true;
  if (!dirty) return;
  dirty = false; renderer.render(scene, camera);
}

// ── Início ──────────────────────────────────────────────────────────────────
const nG = estruturas.filter((e) => e.it.tipo === "gondola").length;
const nE = estruturas.filter((e) => e.it.tipo === "estante" && e.it.kind !== "balcao").length;
const nProd = new Set(D.itens.flatMap((i) => i.prod.map((p) => normCod(p.c)))).size;
$("stats").innerHTML = `<b>${nG}</b> gôndolas · <b>${nE}</b> estantes e expositores · <b>${nProd}</b> produtos endereçados · <b>${caixas.length}</b> caixas`;
redimensionar(); pintar(); aplicarBonecos(); aplicarCaixas();
requestAnimationFrame(frame);
window.__loja = { state, estruturas, caixas, D, camera, controls, selecionar, buscarProduto, bonecos, scene };
