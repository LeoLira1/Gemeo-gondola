<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>/*__UI_CSS__*/</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div id="top">
    <div class="row">
      <div class="panel seg" id="partes"></div>
      <div class="panel field"><label for="qNum">Nº</label><input id="qNum" class="num" inputmode="numeric" placeholder="1–129, escada, chuveiro" autocomplete="off"></div>
      <div class="panel field"><label for="qProd">Produto</label><input id="qProd" placeholder="nome, código ou 2 termos" autocomplete="off"></div>
      <span id="msg"></span>
    </div>
    <div class="row"><div class="panel chips" id="chips"></div></div>
  </div>
  <div id="info" class="panel"></div>
  <div id="legend" class="panel">
    <span><i style="background:#f4f2ed"></i>Fecha com o sistema</span>
    <span><i style="background:#e53935"></i>Carga sem endereço</span>
    <span><i style="background:#1565C0"></i>Endereçado além do sistema</span>
    <span><i style="background:#2e9e4f"></i>Produto buscado</span>
    <span><i style="background:#8B5CF6"></i>Estocado (cooperado, fora do saldo)</span>
    <span><i style="background:transparent;border:1px dashed #8d8b85"></i>Vaga livre</span>
    <span><i style="background:#cfd3d8"></i>Escada p/ mesanino</span>
    <span><i style="background:#1b8a4a"></i>Chuveiro lava-olhos</span>
  </div>
  <div id="stats" class="panel"></div>
  <div id="tip"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
const D = /*__DADOS__*/null;

// ── Estado ──────────────────────────────────────────────────────────────────
const ORANGE = 0xe87722, GREEN = 0x2e9e4f, RED = 0xe53935, BLUE = 0x1565C0;
const PALETE_H = 0.12;                       // palete de madeira sob a pilha
const state = { parte: 1, rua: null, sel: null, matched: new Set(), hover: null };
const fmt = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 });
const $ = (id) => document.getElementById(id);
const fold = (s) => (s || "").toString().normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

const posPorN = new Map(D.posicoes.map((p) => [p.n, p]));
const pilhaDe = (n) => D.pilhas[String(n)] || [];
const ruasDaParte = (p) => D.ruas.filter((r) => r.p === p);
const normCod = (c) => (c || "").trim().toUpperCase();
// Chave de casamento da busca: o estocado liga pelo NOME (o código EST: se repete entre cooperados)
const chave = (c, nome, e) => (e ? "EST|" + nome : normCod(c));

// ── Three.js ────────────────────────────────────────────────────────────────
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeebe4);
const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 400);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 3;
controls.maxDistance = 90;

scene.add(new THREE.HemisphereLight(0xffffff, 0xdcd6c9, 0.74));
const sun = new THREE.DirectionalLight(0xffffff, 0.54);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const mat = (color, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.92, metalness: 0 }, extra));
const M = {
  branco: mat(0xf4f2ed), verde: mat(0x2e9e4f, { roughness: 0.8 }),
  vermelho: mat(RED), azul: mat(BLUE), violeta: mat(0x8B5CF6), madeira: mat(0xc99d66, { roughness: 1 }),
  laje: mat(0xf8f6f1, { roughness: 1 }), vaga: new THREE.MeshBasicMaterial({ color: 0xe6e2d9, transparent: true, opacity: 0.45, depthWrite: false }),
};
const lineGris = new THREE.LineBasicMaterial({ color: 0x9a9892 });
const lineFraca = new THREE.LineBasicMaterial({ color: 0xc9c5bb });
const lineBorda = new THREE.LineBasicMaterial({ color: 0xcfcbc1, transparent: true, opacity: 0.9 });

const geoCache = {};
function boxGeo(w, h, d) {
  const k = [w, h, d].join();
  return (geoCache[k] ||= new THREE.BoxGeometry(w, h, d));
}
function edgesGeo(w, h, d) {
  const k = "e" + [w, h, d].join();
  return (geoCache[k] ||= new THREE.EdgesGeometry(boxGeo(w, h, d)));
}

// caixa em um grupo, sem depender do chão
function addBoxTo(grupo, x0, x1, y0, y1, z0, z1, cor) {
  const m = new THREE.Mesh(boxGeo(x1 - x0, y1 - y0, z1 - z0), mat(cor));
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); m.castShadow = m.receiveShadow = true; grupo.add(m); return m;
}

// Textura procedural de cimento queimado: ruído de baixa resolução (±2–3% de tom), sem arquivo externo.
// 128×128 px (~64 KB), gerada uma vez; o tom base vem da cor do material (#C9C9C6).
const cimentoTex = (() => {
  const S = 128, c = document.createElement("canvas");
  c.width = c.height = S;
  const g = c.getContext("2d"), img = g.createImageData(S, S);
  for (let i = 0; i < S * S; i++) {
    const v = Math.round(255 * (0.975 + Math.random() * 0.025 - Math.sin(i * 0.013) * 0.004));   // 97%–100% do tom base
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter;
  return t;
})();

// Laje do chão (uma só, redimensionada por parte)
const laje = new THREE.Mesh(new THREE.BoxGeometry(1, 0.2, 1), M.laje);
laje.receiveShadow = true;
scene.add(laje);

// Rótulos (sprites com número)
const texCache = {};
function labelTex(texto, estilo) {
  const k = texto + "|" + estilo;
  if (texCache[k]) return texCache[k];
  const c = document.createElement("canvas");
  c.width = 160; c.height = 80;
  const g = c.getContext("2d");
  const cores = {
    n: ["rgba(255,255,255,.92)", "#2b2a27", "#d4d0c6"],
    h: ["#2e9e4f", "#ffffff", "#2e9e4f"],
    s: ["#2b2a27", "#ffffff", "#2b2a27"],
    r: ["rgba(255,255,255,0)", "#a6a298", "rgba(255,255,255,0)"],
  }[estilo];
  g.fillStyle = cores[0]; g.strokeStyle = cores[2]; g.lineWidth = 3;
  g.beginPath(); g.roundRect ? g.roundRect(6, 8, 148, 64, 22) : g.rect(6, 8, 148, 64);
  g.fill(); g.stroke();
  g.fillStyle = cores[1];
  g.font = (estilo === "r" ? "bold 46px" : "bold 44px") + " system-ui, Segoe UI, Arial, sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(texto, 80, 42);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return (texCache[k] = t);
}
const rotulos = [];                        // {s, base}: reescalados com a distância da câmera
function makeLabel(texto, estilo, w) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTex(texto, estilo), transparent: true, depthTest: false }));
  s.scale.set(w, w / 2, 1);
  s.renderOrder = 10;
  s.userData.base = w;
  rotulos.push(s);
  return s;
}

// Uma "casa" por posição: grupo na posição do chão com pilha, vaga e rótulo
const casas = new Map();
for (const p of D.posicoes) {
  const raiz = new THREE.Group();
  raiz.position.set(p.x, 0, p.z);
  const pilha = pilhaDe(p.n);
  const niveis = Math.min(pilha.length, D.geo.niveisMax);

  // contorno da vaga (sempre existe; só aparece quando vazia ou fantasma)
  const rect = new THREE.LineSegments(edgesGeo(p.sx, 0.001, p.sz), lineGris);
  rect.position.y = 0.01;
  const tile = new THREE.Mesh(new THREE.PlaneGeometry(p.sx, p.sz), M.vaga);
  tile.rotation.x = -Math.PI / 2;
  tile.position.y = 0.012;
  tile.userData = { n: p.n, o: 0 };
  raiz.add(rect, tile);

  const stack = new THREE.Group();
  const racks = [];
  if (niveis > 0) {
    // palete de madeira (tampo + 3 travessas)
    const tampo = new THREE.Mesh(boxGeo(p.sx * 0.97, 0.035, p.sz * 0.97), M.madeira);
    tampo.position.y = PALETE_H - 0.0175;
    tampo.castShadow = tampo.receiveShadow = true;
    stack.add(tampo);
    for (const f of [-0.4, 0, 0.4]) {
      const along = p.sx < p.sz;                    // rua de eixo Z: travessas correm em Z
      const t = new THREE.Mesh(
        along ? boxGeo(p.sx * 0.12, PALETE_H - 0.035, p.sz * 0.97) : boxGeo(p.sx * 0.97, PALETE_H - 0.035, p.sz * 0.12), M.madeira);
      t.position.set(along ? f * p.sx * 0.85 : 0, (PALETE_H - 0.035) / 2, along ? 0 : f * p.sz * 0.85);
      t.castShadow = t.receiveShadow = true;
      stack.add(t);
    }
    for (let i = 0; i < niveis; i++) {
      const r = pilha[i];
      const m = new THREE.Mesh(boxGeo(p.sx * 0.985, D.geo.alt, p.sz * 0.985), M.branco);
      m.position.y = PALETE_H + i * D.geo.passoNivel + D.geo.alt / 2;
      m.castShadow = m.receiveShadow = true;
      m.userData = { n: p.n, o: r.o, rack: r };
      const borda = new THREE.LineSegments(edgesGeo(p.sx * 0.985, D.geo.alt, p.sz * 0.985), lineBorda);
      m.add(borda);
      stack.add(m);
      racks.push(m);
    }
  }
  const topo = niveis > 0 ? PALETE_H + (niveis - 1) * D.geo.passoNivel + D.geo.alt : 0.1;
  const rotulo = makeLabel(String(p.n), "n", 1);
  rotulo.position.y = topo + 0.5;
  stack.add(rotulo);
  raiz.add(stack);
  scene.add(raiz);
  casas.set(p.n, { p, raiz, stack, rect, tile, racks, rotulo, topo, vazia: niveis === 0 });
}

// Rótulos de rua (R1…R12) na ponta de menor coordenada de cada rua
const rotulosRua = new Map();
for (const r of D.ruas) {
  const ps = D.posicoes.filter((p) => p.r === r.n);
  const eixoZ = r.eixo === "z";
  const ref = ps.reduce((a, b) => ((eixoZ ? b.z < a.z : b.x < a.x) ? b : a));
  const lado = r.lado * 0.9;      // do lado do corredor: as ruas em par (4/5, 6/7) não se sobrepõem
  const s = makeLabel("R" + r.n, "r", 1);
  s.userData.base = 1.5;
  s.position.set(eixoZ ? ref.x + lado : ref.x - 2.3, 0.15, eixoZ ? ref.z - 2.3 : ref.z + lado);
  scene.add(s);
  rotulosRua.set(r.n, s);
}

// Escada para o mesanino: referência (não é endereço). Parte 1, paralela à Rua 1, sobe do nº 14 ao nº 11.
const escada = { grupo: new THREE.Group(), malhas: [], d: D.escada };
if (D.escada) {
  const E = D.escada, cor = 0xcfd3d8, corLat = 0x8b95a1;
  const L = Math.abs(E.z1 - E.z0), sent = E.sentido, H = E.altura, pat = E.patamar;
  const n = 18, run = (L - pat) / n;                              // degraus de ~24 cm de pisada
  const zDe = (i) => E.z0 + sent * i * run;
  const caixaE = (x0, x1, y0, y1, za, zb, c) => {
    const m = addBoxTo(escada.grupo, x0, x1, y0, y1, Math.min(za, zb), Math.max(za, zb), c);
    m.userData.escada = true; escada.malhas.push(m); return m;
  };
  for (let i = 0; i < n; i++) caixaE(E.x0, E.x1, 0, ((i + 1) * H) / (n + 1), zDe(i), zDe(i + 1), cor);    // degraus (blocos cheios)
  caixaE(E.x0, E.x1, H - 0.1, H, zDe(n), E.z1, 0xe2e5e9);                                                  // patamar
  for (const x of [E.x0 + 0.05, E.x1 - 0.05]) caixaE(x - 0.04, x + 0.04, 0, H - 0.1, E.z1 - sent * 0.06, E.z1 - sent * 0.14, corLat);   // pés do patamar
  // corrimão no lado aberto (o do corredor): postes + barra inclinada que segue os degraus
  const xr = E.lado > 0 ? E.x0 + 0.03 : E.x1 - 0.03, hr = 0.95;
  for (let i = 0; i <= n; i += 3) caixaE(xr - 0.02, xr + 0.02, (Math.min(i + 1, n) * H) / (n + 1), (Math.min(i + 1, n) * H) / (n + 1) + hr, zDe(i) - 0.02, zDe(i) + 0.02, corLat);
  const dz = (n * run) * sent, dy = H - H / (n + 1), len = Math.hypot(dz, dy);
  const rail = new THREE.Mesh(boxGeo(0.05, 0.05, len), mat(corLat));
  rail.position.set(xr, H / (n + 1) + hr + dy / 2, E.z0 + dz / 2); rail.rotation.x = -Math.atan2(dy, Math.abs(dz)) * sent;
  rail.castShadow = true; rail.userData.escada = true; escada.grupo.add(rail); escada.malhas.push(rail);
  caixaE(xr - 0.02, xr + 0.02, H, H + hr, E.z1 - sent * 0.03, E.z1 - sent * 0.03 + sent * 0.04, corLat);                                    // poste do patamar
  scene.add(escada.grupo);
  escada.caixa = { x: (E.x0 + E.x1) / 2, z: (E.z0 + E.z1) / 2, w: E.x1 - E.x0, d: L, h: H };
}

// Chuveiro lava-olhos (equipamento de emergência, referência): verde, com chuveiro no alto, bacia, placa, puxador e pedal.
const lavaolhos = { grupo: new THREE.Group(), malhas: [], d: D.lavaolhos };
if (D.lavaolhos) {
  const Lv = D.lavaolhos, H = Lv.altura, verde = 0x1b8a4a, chapa = 0x0f6b38;
  const parte = (geo, cor, x, y, z, rx = 0, rz = 0) => {
    const m = new THREE.Mesh(geo, mat(cor, { roughness: 0.55 }));
    m.position.set(Lv.x + x, y, Lv.z + z); m.rotation.x = rx; m.rotation.z = rz; m.castShadow = true; m.receiveShadow = true;
    m.userData.lavaolhos = true; lavaolhos.grupo.add(m); lavaolhos.malhas.push(m); return m;
  };
  const cil = (rt, rb, h, seg = 16) => new THREE.CylinderGeometry(rt, rb, h, seg);
  parte(cil(0.27, 0.30, 0.05), verde, 0, 0.025, 0);                       // base redonda
  parte(cil(0.11, 0.17, 0.12), verde, 0, 0.11, 0);                        // pé cônico
  parte(cil(0.04, 0.04, H - 0.18), verde, 0, 0.17 + (H - 0.18) / 2, 0);   // haste
  parte(new THREE.SphereGeometry(0.055, 12, 8), verde, 0, H - 0.1, 0);    // cotovelo
  parte(cil(0.032, 0.032, 0.62), verde, 0.31, H - 0.1, 0, 0, Math.PI / 2); // braço do chuveiro (para o lado do corredor)
  parte(cil(0.05, 0.19, 0.11), verde, 0.62, H - 0.2, 0);                  // cabeça do chuveiro
  parte(cil(0.2, 0.2, 0.012, 20), chapa, 0.62, H - 0.26, 0);              // aro da cabeça
  parte(new THREE.BoxGeometry(0.30, 0.40, 0.02), chapa, 0, H - 0.55, 0.075); // placa de sinalização
  parte(cil(0.004, 0.004, 0.55, 6), 0x9aa3ad, 0.62, H - 0.58, 0);         // cordão
  parte(new THREE.TorusGeometry(0.065, 0.008, 6, 3), 0x9aa3ad, 0.62, H - 0.88, 0, 0, Math.PI / 2 + Math.PI / 6); // puxador triangular
  parte(cil(0.19, 0.12, 0.07, 20), verde, 0.2, 1.0, 0);                   // bacia do lava-olhos
  parte(new THREE.BoxGeometry(0.2, 0.05, 0.05), verde, 0.1, 0.96, 0);     // suporte da bacia
  parte(cil(0.012, 0.012, 0.1, 8), 0x9aa3ad, 0.2, 1.08, 0.07);            // esguichos
  parte(cil(0.012, 0.012, 0.1, 8), 0x9aa3ad, 0.2, 1.08, -0.07);
  parte(new THREE.BoxGeometry(0.30, 0.02, 0.20), 0x9aa3ad, 0.28, 0.01, 0.2); // pedal
  scene.add(lavaolhos.grupo);
  lavaolhos.caixa = { x: Lv.x + 0.28, z: Lv.z, w: 1.05, d: 0.55, h: H };
  // alvo do mouse: caixa em volta de tudo (haste + braço + bacia + pedal)
  const hit = new THREE.Mesh(new THREE.BoxGeometry(lavaolhos.caixa.w, H, lavaolhos.caixa.d), new THREE.MeshBasicMaterial({ visible: false }));
  hit.position.set(lavaolhos.caixa.x, H / 2, lavaolhos.caixa.z); hit.userData.lavaolhos = true; scene.add(hit); lavaolhos.malhas.push(hit); lavaolhos.hit = hit;
}

// Seleção (busca por número) e destaque de hover
const selGrupo = new THREE.Group();
const selFill = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: ORANGE, transparent: true, opacity: 0.35, depthWrite: false }));
selFill.rotation.x = -Math.PI / 2; selFill.position.y = 0.02;
const selBox = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), new THREE.LineBasicMaterial({ color: ORANGE }));
selGrupo.add(selFill, selBox);
selGrupo.visible = false;
scene.add(selGrupo);

const hoverBox = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), new THREE.LineBasicMaterial({ color: 0x2b2a27 }));
hoverBox.visible = false;
scene.add(hoverBox);

// ── Cores ───────────────────────────────────────────────────────────────────
function materialDo(r) {
  if (state.matched.size && state.matched.has(chave(r.c, r.nome, r.e))) return M.verde;     // busca > saldo
  if (r.e) return M.violeta;                                                          // estocado: fora do saldo
  const d = D.divergencia[r.c];
  if (d) return d.t === "falta" ? M.vermelho : M.azul;
  return M.branco;
}
function pintar() {
  for (const c of casas.values()) {
    for (const m of c.racks) m.material = materialDo(m.userData.rack);
    const estilo = state.sel === c.p.n ? "s" : (c.racks.some((m) => m.material === M.verde) ? "h" : "n");
    c.rotulo.material.map = labelTex(String(c.p.n), estilo);
    c.rotulo.material.needsUpdate = true;
  }
  dirty = true;
}

// ── Visibilidade (parte + rua) e interação ──────────────────────────────────
let alvos = [];
function atualizarVisibilidade() {
  alvos = [];
  for (const c of casas.values()) {
    const naParte = c.p.p === state.parte;
    const naRua = state.rua === null || c.p.r === state.rua;
    c.raiz.visible = naParte;
    if (!naParte) continue;
    const mostrar = naRua;
    c.stack.visible = mostrar;               // pilha + palete + rótulo (a vaga livre só tem o rótulo)
    c.rect.visible = c.vazia || !mostrar;
    c.rect.material = mostrar ? lineGris : lineFraca;
    c.tile.visible = c.vazia && mostrar;
    if (mostrar) {
      if (c.vazia) alvos.push(c.tile); else alvos.push(...c.racks);
    }
  }
  for (const [n, s] of rotulosRua) {
    const r = D.ruas.find((x) => x.n === n);
    s.visible = r.p === state.parte;
  }
  if (D.escada) {                                      // referência: sempre visível na parte dela, mesmo com filtro de rua
    const naParteEscada = state.parte === D.escada.parte;
    escada.grupo.visible = naParteEscada;
    if (naParteEscada) alvos.push(...escada.malhas);
  }
  if (D.lavaolhos) {
    const naParteLv = state.parte === D.lavaolhos.parte;
    lavaolhos.grupo.visible = naParteLv;
    if (naParteLv) alvos.push(lavaolhos.hit);
  }
  dirty = true;
}

// Laje + luz + enquadramento
function envelope(filtro) {
  let a = { minX: 1e9, maxX: -1e9, minZ: 1e9, maxZ: -1e9 };
  for (const p of D.posicoes) {
    if (!filtro(p)) continue;
    a.minX = Math.min(a.minX, p.x - p.sx / 2); a.maxX = Math.max(a.maxX, p.x + p.sx / 2);
    a.minZ = Math.min(a.minZ, p.z - p.sz / 2); a.maxZ = Math.max(a.maxZ, p.z + p.sz / 2);
  }
  if (D.escada && filtro({ p: D.escada.parte, r: 1 })) {     // a escada também entra no enquadramento
    a.minX = Math.min(a.minX, D.escada.x0); a.maxX = Math.max(a.maxX, D.escada.x1);
    a.minZ = Math.min(a.minZ, D.escada.z0, D.escada.z1); a.maxZ = Math.max(a.maxZ, D.escada.z0, D.escada.z1);
  }
  if (D.lavaolhos && filtro({ p: D.lavaolhos.parte, r: D.lavaolhos.rua })) {      // o chuveiro também entra no enquadramento
    a.minX = Math.min(a.minX, D.lavaolhos.x - 0.4); a.maxX = Math.max(a.maxX, D.lavaolhos.x + 0.9);
    a.minZ = Math.min(a.minZ, D.lavaolhos.z - 0.4); a.maxZ = Math.max(a.maxZ, D.lavaolhos.z + 0.4);
  }
  return a;
}
function ajustarLaje() {
  const e = envelope((p) => p.p === state.parte);
  const margem = 2.6;
  laje.scale.set(e.maxX - e.minX + margem * 2, 1, e.maxZ - e.minZ + margem * 2);
  laje.position.set((e.minX + e.maxX) / 2, -0.1, (e.minZ + e.maxZ) / 2);
  cimentoTex.repeat.set(laje.scale.x / 3, laje.scale.z / 3);          // um "bloco" de textura a cada ~3 m
  const R = Math.hypot(e.maxX - e.minX, e.maxZ - e.minZ) / 2 + 4;
  const cx = (e.minX + e.maxX) / 2, cz = (e.minZ + e.maxZ) / 2;
  sun.target.position.set(cx, 0, cz);
  sun.position.set(cx - 0.55 * R, 1.35 * R, cz + 0.8 * R);
  Object.assign(sun.shadow.camera, { left: -R, right: R, top: R, bottom: -R, near: 1, far: 6 * R });
  sun.shadow.camera.updateProjectionMatrix();
}

const DIR = new THREE.Vector3(0.28, 0.82, 0.86).normalize();       // olho: de frente (Z+), de cima, levemente à direita
let tween = null;
function voarPara(alvo, pos, dur = 650) {
  tween = { t0: performance.now(), dur, p0: camera.position.clone(), t_0: controls.target.clone(), p1: pos, t1: alvo };
}
const _cam = new THREE.PerspectiveCamera();
const FAIXA = { xMax: 0.95, yMax: 0.72, yMin: -0.82 };   // folga p/ a barra de cima e a legenda
// Caixa (área × altura da pilha) projetada na câmera para uma distância: {x, yMin, yMax} em NDC.
function projetar(alvo, dist, cantos) {
  _cam.fov = camera.fov; _cam.aspect = camera.aspect; _cam.near = 0.1; _cam.far = 1000;
  _cam.updateProjectionMatrix();
  _cam.position.copy(alvo).addScaledVector(DIR, dist);
  _cam.lookAt(alvo); _cam.updateMatrixWorld(); _cam.matrixWorldInverse.copy(_cam.matrixWorld).invert();
  let x = 0, yMin = 1e9, yMax = -1e9;
  for (const c of cantos) { const v = c.clone().project(_cam); x = Math.max(x, Math.abs(v.x)); yMin = Math.min(yMin, v.y); yMax = Math.max(yMax, v.y); }
  return { x, yMin, yMax };
}
function enquadrar(filtro, animar = true) {
  const e = envelope(filtro);
  const cantos = [];
  for (const x of [e.minX, e.maxX]) for (const z of [e.minZ, e.maxZ]) for (const y of [0, 5.4]) cantos.push(new THREE.Vector3(x, y, z));
  const alvo = new THREE.Vector3((e.minX + e.maxX) / 2, 0.8, (e.minZ + e.maxZ) / 2);
  const frente = new THREE.Vector3(-DIR.x, 0, -DIR.z).normalize();    // "para cima" da tela, no chão
  const sinEl = DIR.y, tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  let dist = 30;
  for (let it = 0; it < 4; it++) {
    // menor distância que cabe (bisseção) …
    let lo = 4, hi = 260;
    for (let i = 0; i < 28; i++) {
      const mid = (lo + hi) / 2, r = projetar(alvo, mid, cantos);
      if (r.x <= FAIXA.xMax && r.yMax <= FAIXA.yMax && r.yMin >= FAIXA.yMin) hi = mid; else lo = mid;
    }
    dist = hi;
    // … e centra a caixa na faixa livre deslocando o alvo no chão
    const r = projetar(alvo, dist, cantos);
    const sobra = ((FAIXA.yMax + FAIXA.yMin) / 2) - (r.yMax + r.yMin) / 2;      // >0: a caixa está baixa demais
    alvo.addScaledVector(frente, -sobra * dist * tanV / sinEl);
  }
  const pos = alvo.clone().addScaledVector(DIR, dist);
  if (animar) voarPara(alvo, pos); else { camera.position.copy(pos); controls.target.copy(alvo); controls.update(); }
  dirty = true;
}
const enquadrarVista = (animar = true) =>
  enquadrar((p) => p.p === state.parte && (state.rua === null || p.r === state.rua), animar);

// ── UI: partes e chips ──────────────────────────────────────────────────────
function montarPartes() {
  const box = $("partes");
  box.innerHTML = "";
  for (const parte of [1, 2]) {
    const b = document.createElement("button");
    const n = D.posicoes.filter((p) => p.p === parte).length;
    b.className = parte === state.parte ? "on" : "";
    b.dataset.parte = parte;
    b.innerHTML = `Parte ${parte}<small>${n}</small><span class="dot"></span>`;
    b.onclick = () => irParte(parte);
    box.appendChild(b);
  }
}
function montarChips() {
  const box = $("chips");
  box.innerHTML = "";
  const mk = (txt, rua) => {
    const b = document.createElement("button");
    b.className = "chip" + (state.rua === rua ? " on" : "");
    b.dataset.rua = rua === null ? "" : rua;
    b.innerHTML = `${txt}<span class="dot"></span>`;
    b.onclick = () => { state.rua = rua; refrescar(); enquadrarVista(); };
    box.appendChild(b);
  };
  mk("Todas", null);
  for (const r of ruasDaParte(state.parte)) mk("R" + r.n, r.n);
  marcarPontos();
}

// Posições e ruas onde a busca de produto acende algo
function acertos() {
  const pos = [];
  if (state.matched.size) {
    for (const c of casas.values()) if (c.racks.some((m) => state.matched.has(chave(m.userData.rack.c, m.userData.rack.nome, m.userData.rack.e)))) pos.push(c.p);
  }
  return pos;
}
function marcarPontos() {
  const pos = acertos();
  const ruas = new Set(pos.map((p) => p.r)), partes = new Set(pos.map((p) => p.p));
  document.querySelectorAll("#chips .chip").forEach((b) => {
    b.classList.toggle("has", b.dataset.rua !== "" && ruas.has(+b.dataset.rua));
  });
  document.querySelectorAll("#partes button").forEach((b) => b.classList.toggle("has", partes.has(+b.dataset.parte)));
  return pos;
}

function atualizarStats() {
  const cs = [...casas.values()].filter((c) => c.p.p === state.parte);
  const livres = cs.filter((c) => c.vazia).length;
  const racks = cs.reduce((s, c) => s + c.racks.length, 0);
  const cap = cs.length * D.geo.niveisMax, pct = cap ? Math.round((100 * racks) / cap) : 0;
  $("stats").innerHTML = `Parte ${state.parte}: <b>${pct}%</b> da capacidade (${racks} de ${cap} racks) · <b>${cs.length - livres}</b> de ${cs.length} posições com carga · <b>${livres}</b> livres`;
}

function refrescar() {
  montarPartes(); montarChips(); atualizarVisibilidade(); ajustarLaje(); atualizarStats(); pintar(); atualizarSelecao();
}
function irParte(parte, animar = true) {
  if (state.parte !== parte) { state.parte = parte; state.rua = null; refrescar(); enquadrarVista(animar); }
  else if (state.rua !== null) { state.rua = null; refrescar(); enquadrarVista(animar); }
}

// ── Busca por número ────────────────────────────────────────────────────────
function atualizarSelecao() {
  const c = state.sel && casas.get(state.sel);
  if (!c || c.p.p !== state.parte) { selGrupo.visible = false; hideInfo(); dirty = true; return; }
  const h = Math.max(c.topo, 0.6);
  selFill.scale.set(c.p.sx + 0.5, c.p.sz + 0.5, 1);
  selBox.scale.set(c.p.sx + 0.18, h, c.p.sz + 0.18);
  selBox.position.y = h / 2;
  selGrupo.position.set(c.p.x, 0, c.p.z);
  selGrupo.visible = true;
  mostrarInfo(c);
  dirty = true;
}
function irParaLavaOlhos() {
  if (!D.lavaolhos) return;
  state.sel = null; state.parte = D.lavaolhos.parte; state.rua = null;
  refrescar();
  const cx = lavaolhos.caixa, alvo = new THREE.Vector3(cx.x, cx.h / 2, cx.z);
  voarPara(alvo, alvo.clone().addScaledVector(DIR, 9));
}
function irParaEscada() {
  if (!D.escada) return;
  state.sel = null; state.parte = D.escada.parte; state.rua = null;
  refrescar();
  const cx = escada.caixa, alvo = new THREE.Vector3(cx.x, cx.h / 2, cx.z);
  voarPara(alvo, alvo.clone().addScaledVector(DIR, 17));
}
function irParaPosicao(n) {
  const c = casas.get(n);
  if (!c) return;
  state.sel = n;
  const mudou = state.parte !== c.p.p || state.rua !== null;
  state.parte = c.p.p; state.rua = null;
  refrescar();
  if (mudou) { enquadrarVista(false); }
  const alvo = new THREE.Vector3(c.p.x, Math.max(c.topo / 2, 0.4), c.p.z);
  voarPara(alvo, alvo.clone().addScaledVector(DIR, 13));
}
function mostrarInfo(c) {
  const el = $("info"), p = c.p;
  const pilha = pilhaDe(p.n);
  const linhas = pilha.length
    ? [...pilha].reverse().map((r) => `<div class="lv"><span>N${r.o}</span><span style="text-align:right">${esc(r.nome || r.c)}<br><b>${fmt.format(r.q)} un</b></span></div>`).join("")
    : `<div class="lv"><span></span><span>Vaga livre</span></div>`;
  el.innerHTML = `<button class="x" title="Fechar">×</button><h4>Posição ${p.n} · Rua ${p.r} · Parte ${p.p}</h4>${linhas}`;
  el.style.display = "block";
  el.querySelector(".x").onclick = () => { state.sel = null; $("qNum").value = ""; refrescar(); };
}
function hideInfo() { $("info").style.display = "none"; }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

let tNum = null;
$("qNum").addEventListener("input", () => {
  clearTimeout(tNum);
  tNum = setTimeout(() => {
    const v = $("qNum").value.trim();
    if (!v) { state.sel = null; refrescar(); return; }
    const n = parseInt(v, 10);
    if (/^\d+$/.test(v) && posPorN.has(n)) irParaPosicao(n);
    else if (/^esc/i.test(v)) irParaEscada();
    else if (/^(chuv|lava)/i.test(v)) irParaLavaOlhos();
  }, 350);
});
$("qNum").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  clearTimeout(tNum);
  const n = parseInt($("qNum").value, 10);
  if (posPorN.has(n)) irParaPosicao(n);
  else if (/^esc/i.test($("qNum").value.trim())) irParaEscada();
  else if (/^(chuv|lava)/i.test($("qNum").value.trim())) irParaLavaOlhos();
});

// ── Busca por produto ───────────────────────────────────────────────────────
const catalogo = D.catalogo.map((p) => ({ c: p.c, n: p.n, e: p.e, k: fold(p.n) + " " + fold(p.c) }));
function buscarProduto(q) {
  const limpa = fold(q).trim();
  if (limpa.length < 2) return [];
  const termos = limpa.split(/\s+/);
  return catalogo.filter((p) => termos.every((t) => p.k.includes(t)));
}
let tProd = null;
$("qProd").addEventListener("input", () => {
  clearTimeout(tProd);
  tProd = setTimeout(aplicarBuscaProduto, 220);
});
function aplicarBuscaProduto() {
  const q = $("qProd").value;
  const achados = buscarProduto(q);
  state.matched = new Set(achados.map((p) => chave(p.c, p.n, p.e)));
  const msg = $("msg");
  if (!state.matched.size) {
    msg.innerHTML = q.trim().length >= 2 ? "nenhum produto no galpão" : "";
    pintar(); marcarPontos(); return;
  }
  const pos = marcarPontos();
  const ruas = new Set(pos.map((p) => p.r));
  msg.innerHTML = `<b>${achados.length}</b> produto${achados.length > 1 ? "s" : ""} · <b>${pos.length}</b> posiç${pos.length === 1 ? "ão" : "ões"} · ${ruas.size} rua${ruas.size === 1 ? "" : "s"}`;
  // Se nada do produto está na parte aberta, abre a parte onde ele está.
  const naParte = pos.some((p) => p.p === state.parte);
  if (!naParte && pos.length) { state.parte = pos[0].p; }
  state.rua = null;                                    // várias ruas → "Todas"
  refrescar(); enquadrarVista();
}

// ── Tooltip ─────────────────────────────────────────────────────────────────
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tip = $("tip");
let ultimoMouse = null;
canvas.addEventListener("pointermove", (e) => {
  const rc = canvas.getBoundingClientRect();
  ultimoMouse = { x: e.clientX - rc.left, y: e.clientY - rc.top };
  mouse.set((ultimoMouse.x / rc.width) * 2 - 1, -(ultimoMouse.y / rc.height) * 2 + 1);
  verHover();
});
canvas.addEventListener("pointerleave", () => { tip.style.display = "none"; hoverBox.visible = false; dirty = true; });
function verHover() {
  if (e_dragging) return;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(alvos, false)[0];
  if (!hit) { tip.style.display = "none"; hoverBox.visible = false; canvas.style.cursor = ""; dirty = true; return; }
  const o = hit.object, ud = o.userData, c = casas.get(ud.n);
  canvas.style.cursor = (ud.escada || ud.lavaolhos) ? "help" : "pointer";
  tip.textContent = "";
  const t = (tag, txt, cls) => { const el = document.createElement(tag); el.textContent = txt; if (cls) el.className = cls; tip.appendChild(el); return el; };
  if (ud.lavaolhos) {
    const Lv = D.lavaolhos, cx = lavaolhos.caixa;
    t("b", "Chuveiro lava-olhos");
    t("div", `Equipamento de emergência · na ponta da Rua ${Lv.rua}, além do nº 25`, "s");
    t("div", `Altura de até ${Lv.niveis} níveis (${fmt.format(Lv.altura)} m)`, "s");
    hoverBox.scale.set(cx.w + 0.06, cx.h + 0.06, cx.d + 0.06);
    hoverBox.position.set(cx.x, cx.h / 2, cx.z);
  } else if (ud.escada) {
    const E = D.escada, cx = escada.caixa;
    t("b", "Escada → mesanino");
    t("div", `Referência · sobe do nº ${E.de} ao nº ${E.ate}, paralela à Rua 1`, "s");
    t("div", `Chega na altura do ${3}º nível (${fmt.format(E.altura)} m)`, "s");
    hoverBox.scale.set(cx.w + 0.06, cx.h + 0.06, cx.d + 0.06);
    hoverBox.position.set(cx.x, cx.h / 2, cx.z);
  } else if (ud.rack) {
    const r = ud.rack;
    t("b", `${ud.n} · N${ud.o}`);
    tip.appendChild(document.createElement("br"));
    t("span", r.nome || "(sem nome)");
    tip.appendChild(document.createElement("br"));
    t("span", `Cód. ${r.c}  `);
    t("span", `${fmt.format(r.q)} un`, "q");
    if (r.e) t("div", "Estocado (cooperado) · fora do saldo da loja", "s");
    const d = D.divergencia[r.c];
    if (d) {
      const dif = Math.abs(d.end - d.sis);
      t("div", d.t === "falta" ? `Faltam ${fmt.format(dif)} un por endereçar` : `${fmt.format(dif)} un endereçadas além do sistema`, d.t === "falta" ? "w" : "w az");
      t("div", `Sistema ${fmt.format(d.sis)} · endereçado ${fmt.format(d.end)}` + (d.cods.length ? ` · ${d.cods.join(" + ")}` : ""), d.t === "falta" ? "w" : "w az");
    }
    hoverBox.scale.set(c.p.sx * 0.995 + 0.04, D.geo.alt + 0.04, c.p.sz * 0.995 + 0.04);
    hoverBox.position.set(c.p.x, o.position.y, c.p.z);
  } else {
    t("b", `${ud.n} · vaga livre`);
    hoverBox.scale.set(c.p.sx + 0.04, 0.1, c.p.sz + 0.04);
    hoverBox.position.set(c.p.x, 0.05, c.p.z);
  }
  hoverBox.visible = true;
  tip.style.display = "block";
  const w = $("wrap").clientWidth;
  tip.style.left = Math.min(ultimoMouse.x + 16, w - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.max(ultimoMouse.y - tip.offsetHeight - 12, 6) + "px";
  dirty = true;
}
let e_dragging = false;
canvas.addEventListener("pointerdown", () => { e_dragging = true; tip.style.display = "none"; });
window.addEventListener("pointerup", () => { e_dragging = false; });
canvas.addEventListener("click", (e) => {
  // clique numa pilha seleciona a posição (abre o cartão com os níveis)
  const rc = canvas.getBoundingClientRect();
  mouse.set(((e.clientX - rc.left) / rc.width) * 2 - 1, -((e.clientY - rc.top) / rc.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(alvos, false)[0];
  if (hit && !moveu && hit.object.userData.n) { state.sel = hit.object.userData.n; $("qNum").value = String(state.sel); atualizarSelecao(); pintar(); }
});
let moveu = false, down = null;
canvas.addEventListener("pointerdown", (e) => { down = [e.clientX, e.clientY]; moveu = false; });
canvas.addEventListener("pointermove", (e) => { if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) moveu = true; });

// ── Loop ────────────────────────────────────────────────────────────────────
let dirty = true;
controls.addEventListener("change", () => { dirty = true; });
function redimensionar() {
  const w = $("wrap").clientWidth, h = $("wrap").clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  dirty = true;
}
new ResizeObserver(redimensionar).observe($("wrap"));

const tmpV = new THREE.Vector3();
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function frame(now) {
  requestAnimationFrame(frame);
  if (tween) {
    const k = Math.min((now - tween.t0) / tween.dur, 1), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t_0, tween.t1, e);
    if (k >= 1) tween = null;
    dirty = true;
  }
  // rótulos com tamanho quase constante na tela (sem crescer no zoom nem sumir ao afastar)
  for (const s of rotulos) {
    const d = camera.position.distanceTo(s.getWorldPosition(tmpV));
    s.material.visible = window.__rotulosOn === true;
    const k = THREE.MathUtils.clamp(d * 0.03, 0.6, 1.5) * s.userData.base;
    if (Math.abs(s.scale.x - k) > 1e-3) { s.scale.set(k, k / 2, 1); dirty = true; }
  }
  if (selGrupo.visible) { selFill.material.opacity = 0.28 + 0.14 * Math.sin(now / 280); dirty = true; }
  if (controls.update()) dirty = true;
  if (!dirty) return;
  dirty = false;
  renderer.render(scene, camera);
}

// ── Piso: "cimento" (padrão) ou "branco" — só visual, escolha salva no localStorage ──
const PISO = {
  cimento: { cor: 0xc9c9c6, mapa: cimentoTex, hemi: 0.7, sol: 0.62, vagaCor: 0xf1efe9, vagaOp: 0.7, linha: 0x55544f, fraca: 0x9b9a95, borda: 0x8a8984 },
  branco: { cor: 0xf8f6f1, mapa: null, hemi: 0.74, sol: 0.54, vagaCor: 0xe6e2d9, vagaOp: 0.45, linha: 0x9a9892, fraca: 0xc9c5bb, borda: 0xcfcbc1 },
};
const luzHemi = scene.children.find((o) => o.isHemisphereLight);
const btnPiso = document.createElement("button");
btnPiso.id = "bPiso"; btnPiso.className = "btn";
$("wrap").appendChild(btnPiso);
function aplicarPiso(modo) {
  const p = PISO[modo] || PISO.cimento;
  M.laje.color.setHex(p.cor); M.laje.map = p.mapa; M.laje.roughness = 1; M.laje.metalness = 0; M.laje.needsUpdate = true;
  luzHemi.intensity = p.hemi; sun.intensity = p.sol;
  M.vaga.color.setHex(p.vagaCor); M.vaga.opacity = p.vagaOp;
  lineGris.color.setHex(p.linha); lineFraca.color.setHex(p.fraca); lineBorda.color.setHex(p.borda);
  btnPiso.textContent = modo === "branco" ? "◻" : "▦";
  btnPiso.title = modo === "branco" ? "Piso branco — toque para trocar para cimento" : "Piso cimento — toque para trocar para branco";
  btnPiso.setAttribute("aria-label", btnPiso.title);
  btnPiso.dataset.modo = modo;
  dirty = true;
}
let modoPiso = "cimento";
try { if (localStorage.getItem("camda_piso") === "branco") modoPiso = "branco"; } catch (e) {}
btnPiso.onclick = () => {
  modoPiso = modoPiso === "branco" ? "cimento" : "branco";
  try { localStorage.setItem("camda_piso", modoPiso); } catch (e) {}
  aplicarPiso(modoPiso);
};
aplicarPiso(modoPiso);

// ── Início ──────────────────────────────────────────────────────────────────
redimensionar();
refrescar();
enquadrarVista(false);
requestAnimationFrame(frame);
window.__galpao = { state, casas, D, escada, lavaolhos, irParte, irParaPosicao, aplicarBuscaProduto, camera, controls, renderer, scene };
/*__UI_JS__*/
</script>
