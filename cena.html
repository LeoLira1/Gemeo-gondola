<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>/*__UI_CSS__*/</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div id="top">
    <div class="row">
      <div class="panel seg" id="partes"></div>
      <div class="panel field"><label for="qNum">Nº</label><input id="qNum" class="num" inputmode="numeric" placeholder="1–129, escada, chuveiro, mesa" autocomplete="off"></div>
      <div class="panel field"><label for="qProd">Produto</label><input id="qProd" placeholder="nome, código ou 2 termos" autocomplete="off"></div>
      <div class="panel chips" id="chips"></div>
      <span id="msg"></span>
    </div>
  </div>
  <div id="info" class="panel"></div>
  <div id="legend" class="panel">
    <span><i style="background:#f4f2ed"></i>Fecha com o sistema</span>
    <span><i style="background:#e53935"></i>Carga sem endereço</span>
    <span><i style="background:#1565C0"></i>Endereçado além do sistema</span>
    <span><i style="background:#2e9e4f"></i>Produto buscado</span>
    <span><i style="background:#8B5CF6"></i>Estocado (cooperado, fora do saldo)</span>
    <span><i style="background:transparent;border:1px dashed #8d8b85"></i>Vaga livre</span>
    <span><i style="background:#cfd3d8"></i>Escada p/ mesanino</span>
    <span><i style="background:#1b8a4a"></i>Chuveiro lava-olhos</span>
    <span><i style="background:#cecbc3"></i>Mesa de expedição</span>
  </div>
  <div id="stats" class="panel"></div>
  <div id="tip"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
const D = /*__DADOS__*/null;

// ── Estado ──────────────────────────────────────────────────────────────────
const ORANGE = 0xe87722, GREEN = 0x2e9e4f, RED = 0xe53935, BLUE = 0x1565C0;
const PALETE_H = 0.12;                       // palete de madeira sob a pilha
const state = { parte: 1, rua: null, sel: null, matched: new Set(), hover: null };
const fmt = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 });
const $ = (id) => document.getElementById(id);
const qNum = $("qNum");                    // o campo pode ser levado para a página (levarNumParaPagina)
const fold = (s) => (s || "").toString().normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

const posPorN = new Map(D.posicoes.map((p) => [p.n, p]));
const pilhaDe = (n) => D.pilhas[String(n)] || [];
const ruasDaParte = (p) => D.ruas.filter((r) => r.p === p);
const normCod = (c) => (c || "").trim().toUpperCase();
// Chave de casamento da busca: o estocado liga pelo NOME (o código EST: se repete entre cooperados)
const chave = (c, nome, e) => (e ? "EST|" + nome : normCod(c));

// ── Three.js ────────────────────────────────────────────────────────────────
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeebe4);
const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 400);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 3;
controls.maxDistance = 90;

scene.add(new THREE.HemisphereLight(0xffffff, 0xdcd6c9, 0.74));
const sun = new THREE.DirectionalLight(0xffffff, 0.54);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const mat = (color, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.92, metalness: 0 }, extra));
const M = {
  branco: mat(0xf4f2ed), verde: mat(0x2e9e4f, { roughness: 0.8 }),
  vermelho: mat(RED), azul: mat(BLUE), violeta: mat(0x8B5CF6), madeira: mat(0xc99d66, { roughness: 1 }),
  laje: mat(0xf8f6f1, { roughness: 1 }), vaga: new THREE.MeshBasicMaterial({ color: 0xe6e2d9, transparent: true, opacity: 0.45, depthWrite: false }),
};
const lineGris = new THREE.LineBasicMaterial({ color: 0x9a9892 });
const lineFraca = new THREE.LineBasicMaterial({ color: 0xc9c5bb });
const lineBorda = new THREE.LineBasicMaterial({ color: 0xcfcbc1, transparent: true, opacity: 0.9 });

const geoCache = {};
function boxGeo(w, h, d) {
  const k = [w, h, d].join();
  return (geoCache[k] ||= new THREE.BoxGeometry(w, h, d));
}
function edgesGeo(w, h, d) {
  const k = "e" + [w, h, d].join();
  return (geoCache[k] ||= new THREE.EdgesGeometry(boxGeo(w, h, d)));
}

// caixa em um grupo, sem depender do chão
function addBoxTo(grupo, x0, x1, y0, y1, z0, z1, cor) {
  const m = new THREE.Mesh(boxGeo(x1 - x0, y1 - y0, z1 - z0), mat(cor));
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); m.castShadow = m.receiveShadow = true; grupo.add(m); return m;
}

// Textura procedural de cimento queimado: ruído de baixa resolução (±2–3% de tom), sem arquivo externo.
// 128×128 px (~64 KB), gerada uma vez; o tom base vem da cor do material (#C9C9C6).
const cimentoTex = (() => {
  const S = 128, c = document.createElement("canvas");
  c.width = c.height = S;
  const g = c.getContext("2d"), img = g.createImageData(S, S);
  for (let i = 0; i < S * S; i++) {
    const v = Math.round(255 * (0.975 + Math.random() * 0.025 - Math.sin(i * 0.013) * 0.004));   // 97%–100% do tom base
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter;
  return t;
})();

// Laje do chão (refeita por parte)
const laje = new THREE.Group();   // blocos refeitos por ajustarLaje (a rampa do Galpão 2 abre um rebaixo na frente)
scene.add(laje);

// ── Paleteira manual (transpalete hidráulica) — peça estática de cenário, em metros ─────────────
// Origem no chão, no centro; garfos apontam para +X e a alça fica do lado -X. Não entra na busca nem no toque.
function criarPaleteira(opcoes = {}) {
  const { corChassi = 0xf2c200, capacidade = "2500 kg", comprimentoGarfo = 1.15, larguraTotal = 0.54, sombras = true } = opcoes;
  const mt = {
    amarelo: new THREE.MeshStandardMaterial({ color: corChassi, roughness: 0.6, metalness: 0 }),
    preto: new THREE.MeshStandardMaterial({ color: 0x24242a, roughness: 0.7, metalness: 0 }),
    vermelho: new THREE.MeshStandardMaterial({ color: 0x8f1d1d, roughness: 0.8, metalness: 0 }),
    nylon: new THREE.MeshStandardMaterial({ color: 0xece9e0, roughness: 0.7, metalness: 0 }),
    cromo: new THREE.MeshStandardMaterial({ color: 0xb8bcc2, roughness: 0.55, metalness: 0.2 }),   // sem mapa de ambiente: metal puro ficaria preto
  };
  const ALT_BAIXA = 0.085, ESP_GARFO = 0.05, LARG_GARFO = 0.16, PIVO_X = -0.17;
  const zGarfo = larguraTotal / 2 - LARG_GARFO / 2;

  const raiz = new THREE.Group();
  raiz.name = "Paleteira";
  const base = new THREE.Group();
  base.position.x = -(comprimentoGarfo + (PIVO_X - 0.09)) / 2;     // centraliza
  raiz.add(base);

  const malha = (geo, m, pai) => {
    const o = new THREE.Mesh(geo, m);
    o.castShadow = sombras; o.receiveShadow = sombras;
    pai.add(o);
    return o;
  };

  // tronco de pirâmide (base retangular → topo retangular)
  function geoTronco(bx0, bx1, bz, tx0, tx1, tz, y0, y1) {
    const g = new THREE.BoxGeometry(1, 1, 1);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const topo = p.getY(i) > 0, mx = p.getX(i) > 0, sz = p.getZ(i) > 0 ? 1 : -1;
      p.setXYZ(i, topo ? (mx ? tx1 : tx0) : (mx ? bx1 : bx0), topo ? y1 : y0, sz * (topo ? tz : bz));
    }
    g.computeVertexNormals();
    return g;
  }

  // garfo com ponta arredondada e rasgo da roleta
  function geoGarfo() {
    const L = comprimentoGarfo, w = LARG_GARFO, r = w / 2;
    const s = new THREE.Shape();
    s.moveTo(0, -w / 2); s.lineTo(L - r, -w / 2);
    s.absarc(L - r, 0, r, -Math.PI / 2, Math.PI / 2, false);
    s.lineTo(0, w / 2); s.lineTo(0, -w / 2);
    const fx0 = L - 0.34, fx1 = L - 0.16, fr = 0.035;
    const furo = new THREE.Path();
    furo.moveTo(fx0, -fr); furo.lineTo(fx1, -fr);
    furo.absarc(fx1, 0, fr, -Math.PI / 2, Math.PI / 2, false);
    furo.lineTo(fx0, fr);
    furo.absarc(fx0, 0, fr, Math.PI / 2, (3 * Math.PI) / 2, false);
    s.holes.push(furo);
    const g = new THREE.ExtrudeGeometry(s, { depth: ESP_GARFO - 0.006, bevelEnabled: true, bevelThickness: 0.003, bevelSize: 0.003, bevelSegments: 2, curveSegments: 12 });
    g.rotateX(-Math.PI / 2);                                       // extrusão vira altura (+Y)
    return g;
  }
  const geoRoda = (raio, largura) => new THREE.CylinderGeometry(raio, raio, largura, 24).rotateX(Math.PI / 2);   // eixo em Z

  // corpo (garfos, travessa, torre, adesivo)
  const corpo = new THREE.Group();
  corpo.name = "Corpo";
  base.add(corpo);
  const gGarfo = geoGarfo();
  for (const z of [-zGarfo, zGarfo]) malha(gGarfo, mt.amarelo, corpo).position.set(0, ALT_BAIXA - ESP_GARFO + 0.003, z);
  malha(new THREE.BoxGeometry(0.14, 0.115, larguraTotal), mt.amarelo, corpo).position.set(0.05, 0.0925, 0);
  malha(geoTronco(-0.03, 0.16, 0.25, -0.11, 0.0, 0.07, 0.13, 0.40), mt.amarelo, corpo);
  {
    const cv = document.createElement("canvas");
    cv.width = 256; cv.height = 112;
    const c = cv.getContext("2d");
    c.fillStyle = "#ffffff"; c.fillRect(0, 0, 256, 112);
    c.strokeStyle = "#111"; c.lineWidth = 8; c.strokeRect(4, 4, 248, 104);
    c.fillStyle = "#c62828"; c.font = "bold 54px Arial, sans-serif";
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(capacidade.toUpperCase(), 128, 58);
    const tex = new THREE.CanvasTexture(cv);
    tex.anisotropy = 4;
    const adesivo = new THREE.Mesh(new THREE.PlaneGeometry(0.13, 0.057), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, metalness: 0 }));
    const n = new THREE.Vector3(0.27, 0.16, 0).normalize();
    adesivo.position.set(0.08, 0.265, 0).addScaledVector(n, 0.002);
    adesivo.lookAt(adesivo.position.clone().add(n));
    corpo.add(adesivo);
  }

  // roletas de carga (no chão)
  const gRoleta = geoRoda(0.037, 0.06);
  const gEixoRoleta = new THREE.CylinderGeometry(0.008, 0.008, 0.075, 12).rotateX(Math.PI / 2);
  for (const z of [-zGarfo, zGarfo]) {
    for (const dx of [0.29, 0.21]) {
      const x = comprimentoGarfo - dx;
      malha(gRoleta, mt.nylon, base).position.set(x, 0.037, z);
      malha(gEixoRoleta, mt.cromo, base).position.set(x, 0.037, z);
    }
  }

  // direção: rodas + bomba + alça
  const direcao = new THREE.Group();
  direcao.name = "Direcao";
  direcao.position.set(PIVO_X, 0, 0);
  base.add(direcao);
  const gRoda = geoRoda(0.09, 0.05), gCubo = geoRoda(0.052, 0.054);
  for (const z of [-0.035, 0.035]) {
    malha(gRoda, mt.vermelho, direcao).position.set(0, 0.09, z);
    malha(gCubo, mt.preto, direcao).position.set(0, 0.09, z);
  }
  malha(new THREE.CylinderGeometry(0.012, 0.012, 0.17, 12).rotateX(Math.PI / 2), mt.cromo, direcao).position.set(0, 0.09, 0);
  const gPlaca = new THREE.BoxGeometry(0.12, 0.15, 0.012);
  for (const z of [-0.075, 0.075]) malha(gPlaca, mt.preto, direcao).position.set(0, 0.12, z);
  malha(new THREE.CylinderGeometry(0.09, 0.09, 0.02, 24), mt.preto, direcao).position.set(0, 0.2, 0);

  // bomba hidráulica + mola
  malha(new THREE.CylinderGeometry(0.05, 0.055, 0.19, 20), mt.preto, direcao).position.set(0, 0.305, 0);
  class Helice extends THREE.Curve {
    getPoint(t, alvo = new THREE.Vector3()) {
      const a = t * Math.PI * 2 * 6;
      return alvo.set(Math.cos(a) * 0.068, 0.215 + t * 0.12, Math.sin(a) * 0.068);
    }
  }
  malha(new THREE.TubeGeometry(new Helice(), 120, 0.0055, 5, false), mt.cromo, direcao);
  malha(new THREE.CylinderGeometry(0.02, 0.02, 0.04, 12), mt.cromo, direcao).position.set(0, 0.42, 0);
  malha(new THREE.CylinderGeometry(0.009, 0.009, 0.13, 8).rotateX(Math.PI / 2), mt.cromo, direcao).position.set(0, 0.43, 0);

  // alça
  const alca = new THREE.Group();
  alca.name = "Alca";
  alca.position.set(0, 0.43, 0);
  direcao.add(alca);
  for (const z of [-0.045, 0.045]) malha(new THREE.BoxGeometry(0.05, 0.08, 0.012), mt.preto, alca).position.set(0, 0.02, z);
  malha(new THREE.CylinderGeometry(0.024, 0.024, 0.3, 12), mt.preto, alca).position.set(0, 0.17, 0);
  malha(new THREE.CylinderGeometry(0.017, 0.017, 0.8, 12), mt.preto, alca).position.set(0, 0.4, 0);
  const laco = new THREE.CatmullRomCurve3(
    [[0, 0.48, 0], [0, 0.53, 0.06], [0, 0.63, 0.16], [0, 0.72, 0.19], [0, 0.78, 0.13], [0, 0.80, 0],
     [0, 0.78, -0.13], [0, 0.72, -0.19], [0, 0.63, -0.16], [0, 0.53, -0.06]].map(([x, y, z]) => new THREE.Vector3(x, y, z)),
    true, "centripetal");
  malha(new THREE.TubeGeometry(laco, 60, 0.017, 8, true), mt.preto, alca);
  const gatilho = malha(new THREE.BoxGeometry(0.014, 0.022, 0.11), mt.preto, alca);
  gatilho.position.set(0, 0.70, 0.05);
  gatilho.rotation.x = -0.35;
  alca.rotation.z = 0.12;                                          // alça levemente inclinada para trás

  raiz.userData.dimensoes = { comprimento: comprimentoGarfo + 0.26, largura: larguraTotal, alturaAlca: 1.23 };
  return raiz;
}
// Onde ela fica no galpão (metros, mesma planta dos racks): parte 1, na frente da R8, no vão entre a R8 e a R1.
// Ajuste x/z para mover; ang gira no mapa (π/2 = garfos apontando para o fundo do galpão, alça para quem olha).
const PALETEIRA = { parte: 1, x: 4.6, z: 11.7, ang: Math.PI / 2 };
const paleteira = criarPaleteira({ capacidade: "2500 kg" });
paleteira.position.set(PALETEIRA.x, 0, PALETEIRA.z);
paleteira.rotation.y = PALETEIRA.ang;
scene.add(paleteira);

// Rótulos (sprites com número)
const texCache = {};
function labelTex(texto, estilo) {
  const k = texto + "|" + estilo;
  if (texCache[k]) return texCache[k];
  const c = document.createElement("canvas");
  c.width = 160; c.height = 80;
  const g = c.getContext("2d");
  const cores = {
    n: ["rgba(255,255,255,.92)", "#2b2a27", "#d4d0c6"],
    h: ["#2e9e4f", "#ffffff", "#2e9e4f"],
    s: ["#2b2a27", "#ffffff", "#2b2a27"],
    r: ["rgba(255,255,255,0)", "#a6a298", "rgba(255,255,255,0)"],
  }[estilo];
  g.fillStyle = cores[0]; g.strokeStyle = cores[2]; g.lineWidth = 3;
  g.beginPath(); g.roundRect ? g.roundRect(6, 8, 148, 64, 22) : g.rect(6, 8, 148, 64);
  g.fill(); g.stroke();
  g.fillStyle = cores[1];
  g.font = (estilo === "r" ? "bold 46px" : "bold 44px") + " system-ui, Segoe UI, Arial, sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(texto, 80, 42);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return (texCache[k] = t);
}
const rotulos = [];                        // {s, base}: reescalados com a distância da câmera
function makeLabel(texto, estilo, w) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTex(texto, estilo), transparent: true, depthTest: false }));
  s.scale.set(w, w / 2, 1);
  s.renderOrder = 10;
  s.userData.base = w;
  rotulos.push(s);
  return s;
}

// Uma "casa" por posição: grupo na posição do chão com pilha, vaga e rótulo
const casas = new Map();
for (const p of D.posicoes) {
  const raiz = new THREE.Group();
  raiz.position.set(p.x, 0, p.z);
  const pilha = pilhaDe(p.n);
  const niveis = Math.min(pilha.length, D.geo.niveisMax);

  // contorno da vaga (sempre existe; só aparece quando vazia ou fantasma)
  const rect = new THREE.LineSegments(edgesGeo(p.sx, 0.001, p.sz), lineGris);
  rect.position.y = 0.01;
  const tile = new THREE.Mesh(new THREE.PlaneGeometry(p.sx, p.sz), M.vaga);
  tile.rotation.x = -Math.PI / 2;
  tile.position.y = 0.012;
  tile.userData = { n: p.n, o: 0 };
  raiz.add(rect, tile);

  const stack = new THREE.Group();
  const racks = [];
  if (niveis > 0) {
    // palete de madeira (tampo + 3 travessas)
    const tampo = new THREE.Mesh(boxGeo(p.sx * 0.97, 0.035, p.sz * 0.97), M.madeira);
    tampo.position.y = PALETE_H - 0.0175;
    tampo.castShadow = tampo.receiveShadow = true;
    stack.add(tampo);
    for (const f of [-0.4, 0, 0.4]) {
      const along = p.sx < p.sz;                    // rua de eixo Z: travessas correm em Z
      const t = new THREE.Mesh(
        along ? boxGeo(p.sx * 0.12, PALETE_H - 0.035, p.sz * 0.97) : boxGeo(p.sx * 0.97, PALETE_H - 0.035, p.sz * 0.12), M.madeira);
      t.position.set(along ? f * p.sx * 0.85 : 0, (PALETE_H - 0.035) / 2, along ? 0 : f * p.sz * 0.85);
      t.castShadow = t.receiveShadow = true;
      stack.add(t);
    }
    for (let i = 0; i < niveis; i++) {
      const r = pilha[i];
      const m = new THREE.Mesh(boxGeo(p.sx * 0.985, D.geo.alt, p.sz * 0.985), M.branco);
      m.position.y = PALETE_H + i * D.geo.passoNivel + D.geo.alt / 2;
      m.castShadow = m.receiveShadow = true;
      m.userData = { n: p.n, o: r.o, rack: r };
      const borda = new THREE.LineSegments(edgesGeo(p.sx * 0.985, D.geo.alt, p.sz * 0.985), lineBorda);
      m.add(borda);
      stack.add(m);
      racks.push(m);
    }
  }
  const topo = niveis > 0 ? PALETE_H + (niveis - 1) * D.geo.passoNivel + D.geo.alt : 0.1;
  const rotulo = makeLabel(String(p.n), "n", 1);
  rotulo.position.y = topo + 0.5;
  stack.add(rotulo);
  raiz.add(stack);
  scene.add(raiz);
  casas.set(p.n, { p, raiz, stack, rect, tile, racks, rotulo, topo, vazia: niveis === 0 });
}

// Rótulos de rua (R1…R12) na ponta de menor coordenada de cada rua
const rotulosRua = new Map();
for (const r of D.ruas) {
  const ps = D.posicoes.filter((p) => p.r === r.n);
  const eixoZ = r.eixo === "z";
  const ref = ps.reduce((a, b) => ((eixoZ ? b.z < a.z : b.x < a.x) ? b : a));
  const lado = r.lado * 0.9;      // do lado do corredor: as ruas em par (4/5, 6/7) não se sobrepõem
  const s = makeLabel("R" + r.n, "r", 1);
  s.userData.base = 1.5;
  s.position.set(eixoZ ? ref.x + lado : ref.x - 2.3, 0.15, eixoZ ? ref.z - 2.3 : ref.z + lado);
  scene.add(s);
  rotulosRua.set(r.n, s);
}

// Escada para o mesanino: referência (não é endereço). Parte 1, paralela à Rua 1, sobe do nº 14 ao nº 11.
const escada = { grupo: new THREE.Group(), malhas: [], d: D.escada };
if (D.escada) {
  const E = D.escada, cor = 0xcfd3d8, corLat = 0x8b95a1;
  const L = Math.abs(E.z1 - E.z0), sent = E.sentido, H = E.altura, pat = E.patamar;
  const n = 18, run = (L - pat) / n;                              // degraus de ~24 cm de pisada
  const zDe = (i) => E.z0 + sent * i * run;
  const caixaE = (x0, x1, y0, y1, za, zb, c) => {
    const m = addBoxTo(escada.grupo, x0, x1, y0, y1, Math.min(za, zb), Math.max(za, zb), c);
    m.userData.escada = true; escada.malhas.push(m); return m;
  };
  for (let i = 0; i < n; i++) caixaE(E.x0, E.x1, 0, ((i + 1) * H) / (n + 1), zDe(i), zDe(i + 1), cor);    // degraus (blocos cheios)
  caixaE(E.x0, E.x1, H - 0.1, H, zDe(n), E.z1, 0xe2e5e9);                                                  // patamar
  for (const x of [E.x0 + 0.05, E.x1 - 0.05]) caixaE(x - 0.04, x + 0.04, 0, H - 0.1, E.z1 - sent * 0.06, E.z1 - sent * 0.14, corLat);   // pés do patamar
  // corrimão no lado aberto (o do corredor): postes + barra inclinada que segue os degraus
  const xr = E.lado > 0 ? E.x0 + 0.03 : E.x1 - 0.03, hr = 0.95;
  for (let i = 0; i < n; i += 3) caixaE(xr - 0.02, xr + 0.02, ((i + 1) * H) / (n + 1), ((i + 1) * H) / (n + 1) + hr, zDe(i) - 0.02, zDe(i) + 0.02, corLat);
  caixaE(xr - 0.02, xr + 0.02, H - 0.1, H + hr, zDe(n) - 0.02, zDe(n) + 0.02, corLat);                                                     // poste na quebra entre a escada e o patamar
  const dz = (n * run) * sent, dy = H - H / (n + 1), len = Math.hypot(dz, dy);
  const rail = new THREE.Mesh(boxGeo(0.05, 0.05, len), mat(corLat));
  rail.position.set(xr, H / (n + 1) + hr + dy / 2, E.z0 + dz / 2); rail.rotation.x = -Math.atan2(dy, Math.abs(dz)) * sent;
  rail.castShadow = true; rail.userData.escada = true; escada.grupo.add(rail); escada.malhas.push(rail);
  caixaE(xr - 0.025, xr + 0.025, H + hr - 0.05, H + hr, zDe(n), E.z1 - sent * 0.01, corLat);                                   // corrimão reto sobre o patamar, fechando o da escada
  caixaE(xr - 0.02, xr + 0.02, H, H + hr, E.z1 - sent * 0.03, E.z1 - sent * 0.03 + sent * 0.04, corLat);                                    // poste do patamar
  scene.add(escada.grupo);
  escada.caixa = { x: (E.x0 + E.x1) / 2, z: (E.z0 + E.z1) / 2, w: E.x1 - E.x0, d: L, h: H };
}

// Mesa de expedição (referência): Parte 2, na ponta da Rua 12, além do nº 119.
// Mesa reta com as duas laterais em painel cheio (perfil de alumínio na quina da frente), painel de fundo recuado,
// sem pé de ferro, e gaveteiro embaixo do tampo (2 gavetas + 1 de pasta, com fechadura), junto à lateral do lado do 119.
// Coordenadas locais: X ao longo da mesa (0 = ponta livre, Lt = lado do 119), Y altura, Z do fundo para a frente.
const mesa = { grupo: new THREE.Group(), malhas: [], d: D.mesa };
if (D.mesa) {
  const Ms = D.mesa, L = Ms.comprimento, Lt = Ms.comprimento_total, PR = Ms.profundidade, H = Ms.altura;
  const G = Ms.gaveteiro, GL = G.largura, GP = G.profundidade, GH = G.altura;
  const TAMPO = 0.03, CHAPA = 0.025;
  const cor = { tampo: 0xd9d7d0, corpo: 0xdedcd6, fundo: 0x8f8d88, gaveta: 0xe4e2dc, puxador: 0x6f7680, perfil: 0xa9b0b8, rodizio: 0x26292f };
  const wx = (Z) => Ms.x_fundo + Ms.frente * Z, wz = (X) => Ms.z_ini + Ms.sentido * (Lt - X);
  const caixa = (x, y, z, w, h, d, c) => {
    const m = addBoxTo(mesa.grupo, Math.min(wx(z), wx(z + d)), Math.max(wx(z), wx(z + d)), y, y + h,
      Math.min(wz(x), wz(x + w)), Math.max(wz(x), wz(x + w)), c);
    m.userData.mesa = true; mesa.malhas.push(m); return m;
  };
  const topY = H - TAMPO;
  caixa(-0.01, topY, -0.01, L + 0.02, TAMPO, PR + 0.02, cor.tampo);                            // tampo
  for (const x of [0, L - CHAPA]) caixa(x, 0, 0.02, CHAPA, topY, PR - 0.04, cor.corpo);         // laterais em painel cheio
  caixa(-0.004, 0, PR - 0.035, 0.012, topY, 0.03, cor.perfil);                                  // perfil de alumínio na quina da frente
  caixa(-0.004, 0.18, PR - 0.008, 0.014, topY - 0.36, 0.01, 0x7f868f);                          // rasgo do perfil
  caixa(CHAPA, topY * 0.30, 0.10, L - 2 * CHAPA, topY * 0.70, 0.018, cor.fundo);               // painel de fundo recuado
  // gaveteiro embaixo do tampo, encostado na lateral do lado do 119, avançando um pouco à frente
  const gx = L - CHAPA - G.folga - GL, gz = PR + G.avanco - GP;
  caixa(gx, 0.04, gz, GL, GH - 0.065, GP, cor.corpo);                                           // corpo
  caixa(gx - 0.005, GH - 0.025, gz - 0.005, GL + 0.01, 0.025, GP + 0.01, cor.tampo);           // tampo do gaveteiro
  const util = GH - 0.09, hp = util * 0.21;                                                     // 2 gavetas rasas + 1 de pasta
  const frentes = [[0.05, util - 2 * hp], [0.05 + util - 2 * hp, hp], [0.05 + util - hp, hp]];
  for (const [y, h] of frentes) {
    caixa(gx + 0.008, y + 0.004, gz + GP, GL - 0.016, h - 0.008, 0.016, cor.gaveta);
    if (h === hp) caixa(gx + GL * 0.2, y + h * 0.62, gz + GP + 0.016, GL * 0.6, 0.016, 0.01, cor.puxador);   // puxador embutido
  }
  caixa(gx + GL * 0.47, frentes[2][0] + hp * 0.82, gz + GP + 0.016, 0.022, 0.022, 0.008, cor.perfil);      // fechadura
  for (const [a, b] of [[gx + 0.05, gz + 0.05], [gx + GL - 0.05, gz + 0.05], [gx + 0.05, gz + GP - 0.05], [gx + GL - 0.05, gz + GP - 0.05]])
    caixa(a - 0.02, 0, b - 0.02, 0.04, 0.04, 0.04, cor.rodizio);                                // rodízios
  scene.add(mesa.grupo);
  mesa.caixa = { x: (Ms.x0 + Ms.x1) / 2, z: (Ms.z0 + Ms.z1) / 2, w: Ms.x1 - Ms.x0, d: Ms.z1 - Ms.z0, h: H };
  const hit = new THREE.Mesh(new THREE.BoxGeometry(mesa.caixa.w, mesa.caixa.h, mesa.caixa.d), new THREE.MeshBasicMaterial({ visible: false }));
  hit.position.set(mesa.caixa.x, mesa.caixa.h / 2, mesa.caixa.z); hit.userData.mesa = true; scene.add(hit); mesa.hit = hit;
}

// ── Cores ───────────────────────────────────────────────────────────────────
function materialDo(r) {
  if (state.matched.size && state.matched.has(chave(r.c, r.nome, r.e))) return M.verde;     // busca > saldo
  if (r.e) return M.violeta;                                                          // estocado: fora do saldo
  const d = D.divergencia[r.c];
  if (d) return d.t === "falta" ? M.vermelho : M.azul;
  return M.branco;
}
function pintar() {
  for (const c of casas.values()) {
    for (const m of c.racks) m.material = materialDo(m.userData.rack);
    const estilo = state.sel === c.p.n ? "s" : (c.racks.some((m) => m.material === M.verde) ? "h" : "n");
    c.rotulo.material.map = labelTex(String(c.p.n), estilo);
    c.rotulo.material.needsUpdate = true;
  }
  dirty = true;
}

// ── Visibilidade (parte + rua) e interação ──────────────────────────────────
let alvos = [];
function atualizarVisibilidade() {
  alvos = [];
  for (const c of casas.values()) {
    const naParte = c.p.p === state.parte;
    const naRua = state.rua === null || c.p.r === state.rua;
    c.raiz.visible = naParte;
    if (!naParte) continue;
    const mostrar = naRua;
    c.stack.visible = mostrar;               // pilha + palete + rótulo (a vaga livre só tem o rótulo)
    c.rect.visible = c.vazia || !mostrar;
    c.rect.material = mostrar ? lineGris : lineFraca;
    c.tile.visible = c.vazia && mostrar;
    if (mostrar) {
      if (c.vazia) alvos.push(c.tile); else alvos.push(...c.racks);
    }
  }
  paleteira.visible = state.parte === PALETEIRA.parte;       // cenário: acompanha a parte, não o filtro de rua
  for (const [n, s] of rotulosRua) {
    const r = D.ruas.find((x) => x.n === n);
    s.visible = r.p === state.parte;
  }
  if (D.escada) {                                      // referência: sempre visível na parte dela, mesmo com filtro de rua
    const naParteEscada = state.parte === D.escada.parte;
    escada.grupo.visible = naParteEscada;
    if (naParteEscada) alvos.push(...escada.malhas);
  }
  if (D.lavaolhos) {
    const naParteLv = state.parte === D.lavaolhos.parte;
    lavaolhos.grupo.visible = naParteLv;
    if (naParteLv) alvos.push(lavaolhos.hit);
  }
  if (D.mesa) {
    const naParteMesa = state.parte === D.mesa.parte;
    mesa.grupo.visible = naParteMesa;
    if (naParteMesa) alvos.push(mesa.hit);
  }
  dirty = true;
}

// Laje + luz + enquadramento
function envelope(filtro) {
  let a = { minX: 1e9, maxX: -1e9, minZ: 1e9, maxZ: -1e9 };
  for (const p of D.posicoes) {
    if (!filtro(p)) continue;
    a.minX = Math.min(a.minX, p.x - p.sx / 2); a.maxX = Math.max(a.maxX, p.x + p.sx / 2);
    a.minZ = Math.min(a.minZ, p.z - p.sz / 2); a.maxZ = Math.max(a.maxZ, p.z + p.sz / 2);
  }
  if (D.escada && filtro({ p: D.escada.parte, r: 1 })) {     // a escada também entra no enquadramento
    a.minX = Math.min(a.minX, D.escada.x0); a.maxX = Math.max(a.maxX, D.escada.x1);
    a.minZ = Math.min(a.minZ, D.escada.z0, D.escada.z1); a.maxZ = Math.max(a.maxZ, D.escada.z0, D.escada.z1);
  }
  if (D.lavaolhos && filtro({ p: D.lavaolhos.parte, r: D.lavaolhos.rua })) {      // o chuveiro também entra no enquadramento
    a.minX = Math.min(a.minX, D.lavaolhos.x - 0.4); a.maxX = Math.max(a.maxX, D.lavaolhos.x + 0.9);
    a.minZ = Math.min(a.minZ, D.lavaolhos.z - 0.4); a.maxZ = Math.max(a.maxZ, D.lavaolhos.z + 0.4);
  }
  if (D.mesa && filtro({ p: D.mesa.parte, r: D.mesa.rua })) {      // a mesa também entra no enquadramento
    a.minX = Math.min(a.minX, D.mesa.x0); a.maxX = Math.max(a.maxX, D.mesa.x1);
    a.minZ = Math.min(a.minZ, D.mesa.z0); a.maxZ = Math.max(a.maxZ, D.mesa.z1);
  }
  return a;
}
// Paredes do galpão: fecham o perímetro da laje. Cada painel é uma face única virada para dentro: vista de fora, a parede
// mais próxima da câmera some e não tapa os racks (a frente do Galpão 1 deixa um "fantasma" translúcido para ver o vão).
// Galpão 1: a frente (Z+) é fechada, com um vão (medidas em metros, na planta dos racks, centrado na paleteira).
// Galpão 2: a frente (Z+, lado da mesa) é toda aberta.
const PAREDES = { altura: { 1: 6.0, 2: 5.0 }, margem: 0.7, frente: { 1: { vao: [2.4, 6.8] }, 2: null } };
const paredes = new THREE.Group();
const matParede = new THREE.MeshStandardMaterial({ color: 0xdad4c9, roughness: 1, metalness: 0, side: THREE.FrontSide });
// Texturas (ambientCG, CC0): reboco cru nas paredes (Plaster002) e cimento no piso (Concrete034).
// As imagens vêm embutidas (data URI) pelo app.py; sem elas, ficam a cor lisa e o cimento procedural.
const TEXTURAS = /*__TEXTURAS__*/null;
const TAM_TEX_PAREDE = 2.2, TAM_TEX_PISO = 4.5;   // um bloco de textura a cada ~2,2 m (parede) e ~4,5 m (piso)
const carregarTex = (url, extra) => new THREE.TextureLoader().load(url, (t) => {
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; Object.assign(t, extra);
  M.laje.needsUpdate = matParede.needsUpdate = true; dirty = true;
});
const pisoMapa = TEXTURAS ? carregarTex(TEXTURAS.piso.cor) : cimentoTex;
const pisoNormal = TEXTURAS ? carregarTex(TEXTURAS.piso.normal) : null;
if (TEXTURAS) {
  matParede.map = carregarTex(TEXTURAS.parede.cor);
  matParede.normalMap = carregarTex(TEXTURAS.parede.normal);
  matParede.normalScale.set(0.9, 0.9);
}
scene.add(paredes);
// Porta metálica laminada (veneziana) no fim da escada, na parede do lado dela, na altura do patamar.
const PORTA = { largura: 0.90, altura: 2.10, batente: 0.06 };
function portaVeneziana(xParede, lado, zCentro, yBase) {
  const { largura: W, altura: A, batente: B } = PORTA, g = new THREE.Group();
  const caixa = (w, h, d, x, y, z, m, rx = 0) => {
    const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.rotation.x = rx; g.add(o); return o;
  };
  const claro = mat(0xf3f2ee), grafite = mat(0x8e949b, { roughness: 0.5, metalness: 0.45 });
  const ripa = mat(0xd2d6db, { roughness: 0.45, metalness: 0.5 }), inox = mat(0xb9bdc3, { roughness: 0.35, metalness: 0.6 });
  caixa(B, A, 0.07, -(W + B) / 2, A / 2, 0.035, claro); caixa(B, A, 0.07, (W + B) / 2, A / 2, 0.035, claro);   // batente
  caixa(W + 2 * B, B, 0.07, 0, A + B / 2, 0.035, claro);
  caixa(W, A, 0.03, 0, A / 2, 0.02, grafite);                                                                 // folha
  const passo = 0.062, n = Math.floor((A - 0.16) / passo);
  for (let i = 0; i < n; i++) caixa(W - 0.1, 0.034, 0.03, 0, 0.1 + i * passo + 0.02, 0.05, ripa, -0.6);        // venezianas
  caixa(0.04, 0.2, 0.012, -W / 2 + 0.08, 1.0, 0.045, inox);                                                   // espelho da fechadura
  caixa(0.11, 0.025, 0.03, -W / 2 + 0.13, 1.0, 0.075, inox);                                                  // maçaneta
  g.position.set(xParede - lado * 0.005, yBase, zCentro);
  g.rotation.y = lado > 0 ? -Math.PI / 2 : Math.PI / 2;                                                       // frente para dentro do galpão
  return g;
}
const matFantasma = new THREE.MeshBasicMaterial({ color: 0xa89f90, transparent: true, opacity: 0.28, side: THREE.BackSide, depthWrite: false });
function montarParedes(x0, x1, z0, z1) {
  paredes.clear();
  const H = PAREDES.altura[state.parte] || 5.0, frente = PAREDES.frente[state.parte];
  // [x de, x até, z de, z até, giro Y, fantasma]: a normal do plano (+Z) é girada para apontar ao centro do galpão
  const lados = [
    [x0, x1, z0, z0, 0],                                         // fundo (Z−)
    [x0, x0, z0, z1, Math.PI / 2],                               // ponta X−
    [x1, x1, z0, z1, -Math.PI / 2],                              // ponta X+
  ];
  if (frente) {                                                  // frente (Z+) com vão
    const [va, vb] = frente.vao;
    lados.push([x0, va, z1, z1, Math.PI, true], [vb, x1, z1, z1, Math.PI, true]);
  }
  for (const [xa, xb, za, zb, ry, fantasma] of lados) {
    const len = Math.hypot(xb - xa, zb - za);
    const geo = new THREE.PlaneGeometry(len, H);
    const uv = geo.attributes.uv;                   // textura em escala real: repete a cada TAM_TEX_PAREDE metros
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * len / TAM_TEX_PAREDE, uv.getY(i) * H / TAM_TEX_PAREDE);
    for (const mat of fantasma ? [matParede, matFantasma] : [matParede]) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set((xa + xb) / 2, H / 2, (za + zb) / 2); m.rotation.y = ry; m.receiveShadow = mat === matParede;
      paredes.add(m);
    }
  }
  const E = D.escada;
  if (E && E.parte === state.parte) paredes.add(portaVeneziana(E.lado > 0 ? x1 : x0, E.lado, E.z1 - E.sentido * E.patamar / 2, E.altura));
  paredes.visible = true;
}
// Rampa do Galpão 2: na frente aberta, pequeno declive que desce até o corredor de carregamento (metros, mesma planta dos racks).
// O trecho à direita dela e o da esquerda (mesa) ficam no nível do piso.
const RAMPA = { parte: 2, x0: 17.5, x1: 28.7, prof: 1.5, queda: 0.18 };
const ESPESSURA_LAJE = 0.2;
function uvMundo(geo) {                              // textura em escala real: um bloco a cada TAM_TEX_PISO metros
  const pos = geo.attributes.position, nor = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const topo = Math.abs(nor.getY(i)) > 0.5, lado = Math.abs(nor.getX(i)) > 0.5;
    uv.setXY(i, (topo ? x : lado ? z : x) / TAM_TEX_PISO, (topo ? z : y) / TAM_TEX_PISO);
  }
  return geo;
}
function blocoLaje(xa, xb, za, zb) {
  const geo = new THREE.BoxGeometry(xb - xa, ESPESSURA_LAJE, zb - za);
  geo.translate((xa + xb) / 2, -ESPESSURA_LAJE / 2, (za + zb) / 2);
  const m = new THREE.Mesh(uvMundo(geo), M.laje); m.receiveShadow = true; laje.add(m);
}
function montarLaje(x0, x1, z0, z1) {
  for (const m of laje.children) m.geometry.dispose();
  laje.clear();
  if (state.parte !== RAMPA.parte) { blocoLaje(x0, x1, z0, z1); return; }
  const { x0: xa, x1: xb, prof, queda } = RAMPA, zs = z1 - prof, y1 = -ESPESSURA_LAJE;
  blocoLaje(x0, x1, z0, zs);                         // laje principal, até onde começa o declive
  blocoLaje(x0, xa, zs, z1);                         // trecho da mesa: nível do piso
  blocoLaje(xb, x1, zs, z1);                         // trecho à direita: nível do piso
  // cunha do declive: sobe no piso (y 0) em zs e desce `queda` até z1
  const v = [[xa, 0, zs], [xb, 0, zs], [xb, -queda, z1], [xa, -queda, z1], [xa, y1, z1], [xb, y1, z1]];
  const quad = (a, b, c, d) => [a, b, c, a, c, d];
  const idx = [...quad(0, 3, 2, 1), ...quad(3, 4, 5, 2)];   // rampa (normal para cima) e face da frente
  const pos = [], uv = [];
  for (const i of idx) { const [x, y, z] = v[i]; pos.push(x, y, z); uv.push(x / TAM_TEX_PISO, z / TAM_TEX_PISO); }

  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));

function ajustarLaje() {
  const e = envelope((p) => p.p === state.parte);
  // Paredes a ~70 cm dos paletes (e da escada, do lava-olhos e da mesa, que entram no envelope). No Galpão 2 a frente é
  // aberta e a laje e as pontas terminam na linha da mesa.
  const naMesa = D.mesa && state.parte === D.mesa.parte;
  const margem = PAREDES.margem;
  let x0 = e.minX - margem, x1 = e.maxX + margem;
  const z0 = e.minZ - margem, z1 = naMesa ? D.mesa.z1 : e.maxZ + margem;
  if (D.escada && D.escada.parte === state.parte) {      // a parede do lado da escada encosta nela
    if (D.escada.lado > 0) x1 = D.escada.x1 + 0.01; else x0 = D.escada.x0 - 0.01;
  }
  montarParedes(x0, x1, z0, z1);
  montarLaje(x0, x1, z0, z1);
  const R = Math.hypot(e.maxX - e.minX, e.maxZ - e.minZ) / 2 + 4;
  const cx = (e.minX + e.maxX) / 2, cz = (e.minZ + e.maxZ) / 2;
  sun.target.position.set(cx, 0, cz);
  sun.position.set(cx - 0.55 * R, 1.35 * R, cz + 0.8 * R);
  Object.assign(sun.shadow.camera, { left: -R, right: R, top: R, bottom: -R, near: 1, far: 6 * R });
  sun.shadow.camera.updateProjectionMatrix();
}

const DIR = new THREE.Vector3(0.28, 0.82, 0.86).normalize();       // olho: de frente (Z+), de cima, levemente à direita
let tween = null;
function voarPara(alvo, pos, dur = 650) {
  tween = { t0: performance.now(), dur, p0: camera.position.clone(), t_0: controls.target.clone(), p1: pos, t1: alvo };
}
const _cam = new THREE.PerspectiveCamera();
const FAIXA = { xMax: 0.95, yMax: 0.9, yMin: -0.86 };   // folga p/ a barra de cima (compacta, 1 linha) e a legenda
// Caixa (área × altura da pilha) projetada na câmera para uma distância: {x, yMin, yMax} em NDC.
function projetar(alvo, dist, cantos) {
  _cam.fov = camera.fov; _cam.aspect = camera.aspect; _cam.near = 0.1; _cam.far = 1000;
  _cam.updateProjectionMatrix();
  _cam.position.copy(alvo).addScaledVector(DIR, dist);
  _cam.lookAt(alvo); _cam.updateMatrixWorld(); _cam.matrixWorldInverse.copy(_cam.matrixWorld).invert();
  let x = 0, yMin = 1e9, yMax = -1e9;
  for (const c of cantos) { const v = c.clone().project(_cam); x = Math.max(x, Math.abs(v.x)); yMin = Math.min(yMin, v.y); yMax = Math.max(yMax, v.y); }
  return { x, yMin, yMax };
}
function enquadrar(filtro, animar = true) {
  const e = envelope(filtro);
  const cantos = [];
  for (const x of [e.minX, e.maxX]) for (const z of [e.minZ, e.maxZ]) for (const y of [0, Math.max(5.4, PAREDES.altura[state.parte] || 0)]) cantos.push(new THREE.Vector3(x, y, z));
  const alvo = new THREE.Vector3((e.minX + e.maxX) / 2, 0.8, (e.minZ + e.maxZ) / 2);
  const frente = new THREE.Vector3(-DIR.x, 0, -DIR.z).normalize();    // "para cima" da tela, no chão
  const sinEl = DIR.y, tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  let dist = 30;
  for (let it = 0; it < 4; it++) {
    // menor distância que cabe (bisseção) …
    let lo = 4, hi = 260;
    for (let i = 0; i < 28; i++) {
      const mid = (lo + hi) / 2, r = projetar(alvo, mid, cantos);
      if (r.x <= FAIXA.xMax && r.yMax <= FAIXA.yMax && r.yMin >= FAIXA.yMin) hi = mid; else lo = mid;
    }
    dist = hi;
    // … e centra a caixa na faixa livre deslocando o alvo no chão
    const r = projetar(alvo, dist, cantos);
    const sobra = ((FAIXA.yMax + FAIXA.yMin) / 2) - (r.yMax + r.yMin) / 2;      // >0: a caixa está baixa demais
    alvo.addScaledVector(frente, -sobra * dist * tanV / sinEl);
  }
  const pos = alvo.clone().addScaledVector(DIR, dist);
  if (animar) voarPara(alvo, pos); else { camera.position.copy(pos); controls.target.copy(alvo); controls.update(); }
  dirty = true;
}
const enquadrarVista = (animar = true) =>
  enquadrar((p) => p.p === state.parte && (state.rua === null || p.r === state.rua), animar);

// Posições e ruas onde a busca de produto acende algo
function acertos() {
  const pos = [];

    for (const c of casas.values()) if (c.racks.some((m) => state.matched.has(chave(m.userData.rack.c, m.userData.rack.nome, m.userData.rack.e)))) pos.push(c.p);

function atualizarStats() {
  const cs = [...casas.values()].filter((c) => c.p.p === state.parte);
  const livres = cs.filter((c) => c.vazia).length;
  const racks = cs.reduce((s, c) => s + c.racks.length, 0);
  const cap = cs.length * D.geo.niveisMax, pct = cap ? Math.round((100 * racks) / cap) : 0;
  $("stats").innerHTML = `Parte ${state.parte}: <b>${pct}%</b> da capacidade (${racks} de ${cap} racks) · <b>${cs.length - livres}</b> de ${cs.length} posições com carga · <b>${livres}</b> livres`;

const catalogo = D.catalogo.map((p) => ({ c: p.c, n: p.n, e: p.e, k: fold(p.n) + " " + fold(p.c) }));
function buscarProduto(q) {
  const limpa = fold(q).trim();

  return catalogo.filter((p) => termos.every((t) => p.k.includes(t)));

let dirty = true;
controls.addEventListener("change", () => { dirty = true; });
function redimensionar() {
  const w = $("wrap").clientWidth, h = $("wrap").clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  dirty = true;
}
new ResizeObserver(redimensionar).observe($("wrap"));

const tmpV = new THREE.Vector3();
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function frame(now) {
  requestAnimationFrame(frame);
  if (tween) {
    const k = Math.min((now - tween.t0) / tween.dur, 1), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t_0, tween.t1, e);
    if (k >= 1) tween = null;
    dirty = true;
  }
  // rótulos com tamanho quase constante na tela (sem crescer no zoom nem sumir ao afastar)
  for (const s of rotulos) {
    const d = camera.position.distanceTo(s.getWorldPosition(tmpV));
    s.material.visible = window.__rotulosOn === true;
    const k = THREE.MathUtils.clamp(d * 0.03, 0.6, 1.5) * s.userData.base;
    if (Math.abs(s.scale.x - k) > 1e-3) { s.scale.set(k, k / 2, 1); dirty = true; }
  }
  if (selGrupo.visible) { selFill.material.opacity = 0.28 + 0.14 * Math.sin(now / 280); dirty = true; }
  if (controls.update()) dirty = true;
  if (!dirty) return;
  dirty = false;
  renderer.render(scene, camera);
}

// ── Piso: "cimento" (padrão) ou "branco" — só visual, escolha salva no localStorage ──
const PISO = {
  cimento: { parede: 0xdad4c9, cor: TEXTURAS ? 0xfafaf8 : 0xc9c9c6, mapa: pisoMapa, normal: pisoNormal, hemi: 0.7, sol: 0.62, vagaCor: 0xf1efe9, vagaOp: 0.7, linha: 0x55544f, fraca: 0x9b9a95, borda: 0x8a8984 },
  branco: { parede: 0xf0ece4, cor: 0xf8f6f1, mapa: null, hemi: 0.74, sol: 0.54, vagaCor: 0xe6e2d9, vagaOp: 0.45, linha: 0x9a9892, fraca: 0xc9c5bb, borda: 0xcfcbc1 },
};
const luzHemi = scene.children.find((o) => o.isHemisphereLight);
const btnPiso = document.createElement("button");
btnPiso.id = "bPiso"; btnPiso.className = "btn";
$("wrap").appendChild(btnPiso);
function aplicarPiso(modo) {
  const p = PISO[modo] || PISO.cimento;
  matParede.color.setHex(p.parede);
  M.laje.color.setHex(p.cor); M.laje.map = p.mapa; M.laje.normalMap = p.normal || null; M.laje.roughness = 1; M.laje.metalness = 0; M.laje.needsUpdate = true;
  luzHemi.intensity = p.hemi; sun.intensity = p.sol;
  M.vaga.color.setHex(p.vagaCor); M.vaga.opacity = p.vagaOp;
  lineGris.color.setHex(p.linha); lineFraca.color.setHex(p.fraca); lineBorda.color.setHex(p.borda);
  btnPiso.textContent = modo === "branco" ? "◻" : "▦";
  btnPiso.title = modo === "branco" ? "Piso branco — toque para trocar para cimento" : "Piso cimento — toque para trocar para branco";
  btnPiso.setAttribute("aria-label", btnPiso.title);
  btnPiso.dataset.modo = modo;
  dirty = true;
}
let modoPiso = "cimento";
try { if (localStorage.getItem("camda_piso") === "branco") modoPiso = "branco"; } catch (e) {}
btnPiso.onclick = () => {
  modoPiso = modoPiso === "branco" ? "cimento" : "branco";
  try { localStorage.setItem("camda_piso", modoPiso); } catch (e) {}
  aplicarPiso(modoPiso);
};
aplicarPiso(modoPiso);

// ── Início ──────────────────────────────────────────────────────────────────
redimensionar();
refrescar();
enquadrarVista(false);
requestAnimationFrame(frame);
window.__galpao = { state, casas, D, escada, lavaolhos, mesa, irParte, irParaPosicao, aplicarBuscaProduto, camera, controls, renderer, scene };
/*__UI_JS__*/
</script>
