<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #eeebe4; --panel: rgba(255,255,255,.88); --ink: #2b2a27; --muted: #8a877f;
    --line: #d9d5cb; --accent: #e87722; --hit: #2e9e4f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  #wrap { position: relative; width: 100%; height: 100%; }
  #gl { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 6px 24px rgba(60,50,30,.10); backdrop-filter: blur(6px); }
  #top { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; pointer-events: none; }
  #top > * { pointer-events: auto; }
  .seg { display: inline-flex; padding: 3px; gap: 3px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 9px; cursor: pointer;
    font: inherit; font-weight: 600; color: var(--muted); position: relative; }
  .seg button.on { background: var(--accent); color: #fff; }
  .dot { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--hit); box-shadow: 0 0 0 2px #fff; display: none; }
  .has > .dot { display: block; }
  .field { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; }
  .field label { color: var(--muted); font-weight: 600; font-size: 12px; }
  .field input { border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); width: 150px; padding: 4px 0; }
  .field input.num { width: 84px; }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(232,119,34,.25); }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 12px; cursor: pointer;
    font: inherit; font-weight: 600; color: #5d5a53; box-shadow: 0 6px 24px rgba(60,50,30,.10); }
  .btn:hover { background: #fff; }
  #msg { color: var(--muted); font-size: 12px; padding: 0 4px; }
  #msg b { color: var(--hit); }
  #stats { position: absolute; right: 12px; bottom: 12px; padding: 8px 12px; color: #5d5a53; font-size: 12px; text-align: right; }
  #legend { position: absolute; left: 12px; bottom: 12px; padding: 8px 12px; display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; color: #5d5a53; max-width: calc(100% - 330px); }
  #legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -2px;
    border: 1px solid rgba(0,0,0,.18); }
  #info { position: absolute; right: 12px; top: 64px; width: 290px; max-height: calc(100% - 150px); overflow: auto;
    padding: 10px 12px; display: none; }
  #info h4 { margin: 0 0 2px; font-size: 13px; }
  #info .sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  #info .lv { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-top: 1px solid var(--line); }
  #info .lv .l { color: var(--muted); font-weight: 600; white-space: nowrap; font-size: 12px; }
  #info .lv .p { text-align: right; }
  #info .lv.m .p { color: var(--hit); font-weight: 700; }
  #info .x { float: right; cursor: pointer; color: var(--muted); border: 0; background: none; font-size: 16px; line-height: 1; }
  #tip { position: absolute; display: none; pointer-events: none; z-index: 5; max-width: 320px; padding: 8px 10px;
    background: rgba(35,33,30,.94); color: #fff; border-radius: 9px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  #tip b { font-size: 13px; }
  #tip .s { color: #cfcac0; }
  #tip .li { margin-top: 2px; }
  #tip .li.m { color: #8be0a5; font-weight: 700; }
  #tip .w { margin-top: 3px; color: #ffb4a8; }
  #tip .w.az { color: #9ec5ff; }
  @media (max-width: 760px) { #info { display: none !important; } #legend { max-width: 100%; bottom: 52px; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div id="top">
    <div class="panel seg" id="chips"></div>
    <div class="panel field"><label for="qNum">Nº</label><input id="qNum" class="num" placeholder="G7 E5 100 BAR7" autocomplete="off" style="width:130px"></div>
    <div class="panel field"><label for="qProd">Produto</label><input id="qProd" placeholder="nome, código ou 2 termos" autocomplete="off"></div>
    <button class="btn" id="bBoneco" title="Quantos bonecos caminham pela loja">🚶 1</button>
    <span id="msg"></span>
  </div>
  <div id="info" class="panel"></div>
  <div id="legend" class="panel">
    <span><i style="background:#4caf50"></i>Gôndola</span>
    <span><i style="background:#4a93d8"></i>Estante</span>
    <span><i style="background:#f4f2ed"></i>Rack</span>
    <span><i style="background:#e53935"></i>Sem endereço</span>
    <span><i style="background:#1565C0"></i>Além do sistema</span>
    <span><i style="background:#e6dfcf"></i>Bag</span>
    <span><i style="background:#2e9e4f"></i>Produto buscado</span>
  </div>
  <div id="stats" class="panel"></div>
  <div id="tip"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
const D = /*__DADOS__*/null;
const L = D.loja, G = D.galpao, B = D.barracao, LIM = D.limites;

const ORANGE = 0xe87722, GREEN = 0x2e9e4f, RED = 0xe53935, BLUE = 0x1565C0;
const C_GOND = 0x4caf50, C_EST = 0x4a93d8, C_BALCAO = 0x1f9350, C_TAMPO = 0x8a6a52, C_PAREDE = 0xd2cdc2, C_FADE = 0xe9e6df;
const C_RACK = 0xf4f2ed, C_MADEIRA = 0xc99d66, C_BAG = 0xe6dfcf;
const state = { sel: null, matched: new Set(), bonecos: 1 };
const fmt = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 });
const $ = (id) => document.getElementById(id);
const fold = (s) => (s || "").toString().normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const normCod = (c) => (c || "").trim().toUpperCase();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isMatch = (cod) => state.matched.size > 0 && state.matched.has(normCod(cod));

// ── Three.js ────────────────────────────────────────────────────────────────
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeebe4);
const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 900);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47; controls.minDistance = 3; controls.maxDistance = 220;

scene.add(new THREE.HemisphereLight(0xffffff, 0xdcd6c9, 0.74));
const sun = new THREE.DirectionalLight(0xffffff, 0.54);
sun.castShadow = true; const SM = Math.min((navigator.maxTouchPoints || 0) > 0 ? 2048 : 4096, renderer.capabilities.maxTextureSize); sun.shadow.mapSize.set(SM, SM); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
const CX = (LIM.x0 + LIM.x1) / 2, CZ = (LIM.z0 + LIM.z1) / 2, R0 = Math.hypot(LIM.x1 - LIM.x0, LIM.z1 - LIM.z0) / 2 + 4;
sun.target.position.set(CX, 0, CZ);
sun.position.set(CX - 0.55 * R0, 1.35 * R0, CZ + 0.8 * R0);
Object.assign(sun.shadow.camera, { left: -R0, right: R0, top: R0, bottom: -R0, near: 1, far: 6 * R0 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);

const matCache = {};
const getMat = (hex) => (matCache[hex] ||= new THREE.MeshStandardMaterial({ color: hex, roughness: 0.92, metalness: 0 }));
const lerpHex = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), t).getHex();
const geoCache = {};
const boxGeo = (w, h, d) => (geoCache[[w, h, d].map((v) => v.toFixed(4)).join()] ||= new THREE.BoxGeometry(w, h, d));
const edgesGeo = (w, h, d) => (geoCache["e" + [w, h, d].map((v) => v.toFixed(4)).join()] ||= new THREE.EdgesGeometry(boxGeo(w, h, d)));
function addBox(x0, x1, y0, y1, z0, z1, color, parent = scene, sombra = true) {
  const m = new THREE.Mesh(boxGeo(x1 - x0, y1 - y0, z1 - z0), getMat(color));
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); m.castShadow = sombra; m.receiveShadow = true;
  parent.add(m); return m;
}
function plane(x0, x1, z0, z1, mat, y = 0.004) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0), mat);
  m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2, y, (z0 + z1) / 2); m.receiveShadow = true; scene.add(m); return m;
}

// ── Rótulos (sprites, com tamanho quase constante na tela) ──────────────────
const texCache = {};
function labelTex(txt, estilo) {
  const k = txt + "|" + estilo;
  return (texCache[k] ||= (() => {
    const c = document.createElement("canvas"); c.width = 192; c.height = 80;
    const g = c.getContext("2d");
    const cores = { n: ["rgba(255,255,255,.93)", "#2b2a27", "#d4d0c6"], h: ["#2e9e4f", "#fff", "#2e9e4f"], s: ["#e87722", "#fff", "#e87722"] }[estilo];
    g.fillStyle = cores[0]; g.strokeStyle = cores[2]; g.lineWidth = 3;
    g.beginPath(); g.roundRect ? g.roundRect(6, 8, 180, 64, 22) : g.rect(6, 8, 180, 64); g.fill(); g.stroke();
    g.fillStyle = cores[1]; g.font = "bold 40px system-ui, Segoe UI, Arial, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(txt, 96, 42);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
  })());
}
const rotulos = [];                                   // {s, base, lod}
function criarRotulo(txt, x, y, z, base, lod) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTex(txt, "n"), transparent: true, depthTest: false }));
  s.renderOrder = 10; s.position.set(x, y, z); s.userData = { base, lod: lod || 1e9, txt }; scene.add(s); rotulos.push(s); return s;
}
function setRotulo(s, estilo) { s.material.map = labelTex(s.userData.txt, estilo); s.material.needsUpdate = true; }
// texto deitado no chão (nomes de prédios, corredores, referências)
function textoNoChao(txt, x, z, larg, { rot = 0, cor = "rgba(21,24,28,.5)", y = 0.012 } = {}) {
  const c = document.createElement("canvas"); c.width = 1024; c.height = 128;
  const g = c.getContext("2d");
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = cor;
  let px = 76;                                       // encolhe a fonte até o texto caber na tela do canvas
  do { g.font = `700 ${px}px system-ui, Segoe UI, Arial, sans-serif`; if (g.letterSpacing !== undefined) g.letterSpacing = px / 10 + "px"; px -= 4; }
  while (g.measureText(txt).width > 980 && px > 20);
  g.fillText(txt, 512, 66);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(larg, larg * 128 / 1024), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.rotation.z = rot; m.position.set(x, y, z); m.renderOrder = 2; scene.add(m); return m;
}

// plaqueta flutuante com o nome do prédio: legível na vista geral, some quando a câmera chega perto
const nomesPredio = [];
function nomePredio(txt, x, y, z) {
  const c = document.createElement("canvas"); c.width = 640; c.height = 110;
  const g = c.getContext("2d");
  g.fillStyle = "rgba(43,42,39,.86)"; g.beginPath(); g.roundRect ? g.roundRect(4, 4, 632, 102, 30) : g.rect(4, 4, 632, 102); g.fill();
  g.fillStyle = "#fff"; g.font = "700 56px system-ui, Segoe UI, Arial, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  if (g.letterSpacing !== undefined) g.letterSpacing = "5px";
  g.fillText(txt, 320, 58);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false }));
  s.scale.set(11, (11 * 110) / 640, 1); s.position.set(x, y, z); s.renderOrder = 12; scene.add(s); nomesPredio.push(s);
}
// ── Chão: laje, corredores, pisos e paredes dos prédios ────────────────────
const MARG = 7;
const laje = new THREE.Mesh(new THREE.BoxGeometry(LIM.x1 - LIM.x0 + 2 * MARG, 0.2, LIM.z1 - LIM.z0 + 2 * MARG), getMat(0xf8f6f1));
laje.position.set(CX, -0.101, CZ); laje.receiveShadow = true; scene.add(laje);
const matCorredor = new THREE.MeshStandardMaterial({ color: 0xe4e1d9, roughness: 1 });
const matPisoGalpao = new THREE.MeshStandardMaterial({ color: 0xdedbd3, roughness: 1 });
const matPisoBarracao = new THREE.MeshStandardMaterial({ color: 0xd9d5cc, roughness: 1 });
for (const c of D.corredores) {
  plane(c.x0, c.x1, c.z0, c.z1, matCorredor, 0.002);
  const vertical = (c.z1 - c.z0) > (c.x1 - c.x0);
  textoNoChao(c.nome, (c.x0 + c.x1) / 2, (c.z0 + c.z1) / 2, vertical ? Math.min(c.z1 - c.z0 - 1, 12) : 8, { rot: vertical ? -Math.PI / 2 : 0, cor: "rgba(90,86,78,.55)" });
}
{ // piso de ladrilhos da loja (igual ao mapa da loja)
  const P = D.loja.loja.parede, W = D.loja.loja.w, H = D.loja.loja.h;
  const nx = Math.round(W - 2 * P), nz = Math.round(H - 2 * P);
  const c = document.createElement("canvas"); c.width = nx * 64; c.height = nz * 64;
  const g = c.getContext("2d"); g.fillStyle = "#e1dfd9"; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = "rgba(0,0,0,.09)"; g.lineWidth = 2;
  for (let i = 0; i <= nx; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, c.height); g.stroke(); }
  for (let j = 0; j <= nz; j++) { g.beginPath(); g.moveTo(0, j * 64); g.lineTo(c.width, j * 64); g.stroke(); }
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  plane(P, W - P, P, H - P, new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }), 0.003);
}
const PRED = D.predios, PG = D.parede_galpao, ALT_PAREDE = 1.4;
function paredesRetangulo(r, esp, h) {
  addBox(r.x0, r.x1, 0, h, r.z0, r.z0 + esp, C_PAREDE); addBox(r.x0, r.x1, 0, h, r.z1 - esp, r.z1, C_PAREDE);
  addBox(r.x0, r.x0 + esp, 0, h, r.z0 + esp, r.z1 - esp, C_PAREDE); addBox(r.x1 - esp, r.x1, 0, h, r.z0 + esp, r.z1 - esp, C_PAREDE);
}
for (const k of ["galpao1", "galpao2"]) {
  const r = PRED[k];
  plane(r.x0 + PG, r.x1 - PG, r.z0 + PG, r.z1 - PG, matPisoGalpao, 0.003);
  paredesRetangulo(r, PG, ALT_PAREDE);
  nomePredio(r.nome, (r.x0 + r.x1) / 2, 7.5, r.z0 + 2);
}
// loja: paredes (as do mapa da loja, 0,9 m)
{
  const lw = D.loja.loja; const r = PRED.loja, e = lw.parede;
  nomePredio("LOJA", 5, 2.2, 16.2);
  const lojaParedes = [[0, e, 0, lw.h], [0, lw.w, 0, e], [0, lw.w, lw.h - e, lw.h], [lw.w - e, lw.w, 0, lw.h]];
  for (const [x0, x1, z0, z1] of lojaParedes) addBox(x0, x1, 0, lw.paredeH, z0, z1, C_PAREDE);
}
// barracão: paredes com as aberturas na frente (sul), piso, nome
const BR = PRED.barracao, BZ1 = BR.z1;                          // z do mundo da parede da frente (local z = 0)
const bwz = (z) => BZ1 - z;                                      // local z (da frente para o fundo) → mundo
{
  const e = B.esp, h = 1.6;
  plane(BR.x0 + e, BR.x1 - e, BR.z0 + e, BR.z1 - e, matPisoBarracao, 0.003);
  addBox(BR.x0, BR.x1, 0, h, BR.z0, BR.z0 + e, C_PAREDE);                            // fundo (norte)
  addBox(BR.x0, BR.x0 + e, 0, h, BR.z0 + e, BR.z1 - e, C_PAREDE);                    // laterais
  addBox(BR.x1 - e, BR.x1, 0, h, BR.z0 + e, BR.z1 - e, C_PAREDE);
  let x = 0;
  for (const a of B.aberturas.concat([{ x0: B.w, x1: B.w }])) {                     // frente: panos entre as aberturas
    if (a.x0 > x) addBox(BR.x0 + x, BR.x0 + a.x0, 0, h, BZ1 - e, BZ1, C_PAREDE);
    x = a.x1;
  }
  for (const a of B.aberturas) {                                                     // marca das aberturas no chão
    const m = new THREE.Mesh(new THREE.PlaneGeometry(a.x1 - a.x0, e + 0.1), new THREE.MeshBasicMaterial({ color: a.tipo === "PORTÃO" ? ORANGE : 0xb9b4a8, transparent: true, opacity: 0.55 }));
    m.rotation.x = -Math.PI / 2; m.position.set(BR.x0 + (a.x0 + a.x1) / 2, 0.02, BZ1 - e / 2); scene.add(m);
  }
  nomePredio(BR.nome, (BR.x0 + BR.x1) / 2, 4.5, (BR.z0 + BR.z1) / 2);
}
// portão da propriedade (ponta de baixo do corredor da loja)
{
  const p = D.portao;
  for (const sx of [-1, 1]) addBox(p.x + sx * p.larg / 2 - 0.12, p.x + sx * p.larg / 2 + 0.12, 0, 1.8, p.z - 0.12, p.z + 0.12, 0x8a877f);
  addBox(p.x - p.larg / 2, p.x + p.larg / 2, 1.65, 1.8, p.z - 0.05, p.z + 0.05, 0x8a877f);
  textoNoChao("PORTÃO", p.x, p.z + 1.2, 3.4, { cor: "rgba(90,86,78,.85)" });
}

// ── Estruturas da loja (porte do mapa da loja) ──────────────────────────────
const SH = 0.013, EH = L.estanteH;
function novaEstrutura() { return { group: new THREE.Group(), parts: [] }; }
function caixa(S, x0, x1, y0, y1, z0, z1, role) {
  const m = new THREE.Mesh(boxGeo(x1 - x0, y1 - y0, z1 - z0), getMat(0xffffff));
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); m.castShadow = m.receiveShadow = true;
  S.group.add(m); S.parts.push({ m, role });
}
function montarGondola(S, it) {
  const e = L.gondola.escala;
  for (const [r, yc, h] of L.gondola.prat) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r * e, r * e, h * e, 6), getMat(0xffffff));
    m.rotation.y = Math.PI / 2; m.position.set(it.x, yc * e, it.z); m.castShadow = m.receiveShadow = true;
    S.group.add(m); S.parts.push({ m, role: "cor" });
  }
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.28 * e, 0.28 * e, (3.30 - 0.85) * e, 6), getMat(0xffffff));
  p.rotation.y = Math.PI / 2; p.position.set(it.x, ((0.85 + 3.30) / 2) * e, it.z); p.castShadow = true;
  S.group.add(p); S.parts.push({ m: p, role: "cor" });
  S.h = (3.43 + 0.26 / 2) * e;
}
function montarEstante(S, it, cx = it.x, cz = it.z, w = it.w, d = it.d, nNiveis = 5, h = EH) {
  const hw = w / 2, hd = d / 2, pW = 0.04, pD = 0.028;
  for (const [px, pz] of [[cx - hw + pW, cz - hd + pD], [cx + hw - pW, cz - hd + pD], [cx - hw + pW, cz + hd - pD], [cx + hw - pW, cz + hd - pD]])
    caixa(S, px - pW, px + pW, 0, h, pz - pD, pz + pD, "poste");
  for (let i = 0; i < nNiveis; i++) { const y = (i * (h - SH)) / (nNiveis - 1); caixa(S, cx - hw + pW * 2, cx + hw - pW * 2, y, y + SH, cz - hd + pD, cz + hd - pD, "cor"); }
  S.h = h;
}
function montarEdr300x3(S, it) {
  const n = 3, alongZ = it.d >= it.w;
  for (let k = 0; k < n; k++) {
    if (alongZ) montarEstante(S, it, it.x, it.z - it.d / 2 + (it.d * (k + 0.5)) / n, it.w, it.d / n, 6);
    else montarEstante(S, it, it.x - it.w / 2 + (it.w * (k + 0.5)) / n, it.z, it.w / n, it.d, 6);
  }
}
function montarParede(S, it) {
  const hw = it.w / 2, hd = it.d / 2, h = 0.55, nN = 6, nS = 6;

  el.querySelector(".x").onclick = () => limparSelecao();
}
function limparSelecao() { state.sel = null; selGrupo.visible = false; $("info").style.display = "none"; $("qNum").value = ""; pintar(); }
function selecionar(e, voar) {
  if (!e) { limparSelecao(); return; }
  state.sel = e;
  selFill.scale.set(e.w + 0.3, e.d + 0.3, 1); selBox.scale.set(e.w + 0.12, Math.max(e.h, 0.6), e.d + 0.12); selBox.position.y = Math.max(e.h, 0.6) / 2;
  selGrupo.position.set(e.x, 0, e.z); selGrupo.visible = true;
  mostrarCartao(e); pintar();
  if (voar) { const alvo = new THREE.Vector3(e.x, 0.4, e.z); voarPara(alvo, alvo.clone().addScaledVector(DIR, e.area === "loja" ? 8 : 12)); }
}

// ── Busca por número ────────────────────────────────────────────────────────
function acharNumero(txt) {
  const t = txt.trim().toLowerCase().replace(/\s+/g, "");
  let m;
  if ((m = /^g(\d{1,2})$/.exec(t))) return lojaEstr.find((e) => e.it.tipo === "gondola" && e.it.n === +m[1]);
  if ((m = /^e(\d{1,2})$/.exec(t))) { const n = +m[1]; return lojaEstr.find((e) => e.it.tipo === "estante" && e.it.kind !== "balcao" && (e.it.n === n || (e.it.kind === "parede" && n >= 13 && n <= 18))); }
  if ((m = /^b(?:ar)?-?(\d{1,3})$/.exec(t))) return barPal.find((e) => e.p.rot === "BAR-" + String(+m[1]).padStart(2, "0"));
  if (/^\d{1,3}$/.test(t)) return galpaoPos.get(+t);
  return null;
}
let tNum = null;
const irNumero = () => { const v = $("qNum").value.trim(); if (!v) { limparSelecao(); return; } const e = acharNumero(v); if (e) selecionar(e, true); };
$("qNum").addEventListener("input", () => { clearTimeout(tNum); tNum = setTimeout(irNumero, 400); });
$("qNum").addEventListener("keydown", (ev) => { if (ev.key === "Enter") { clearTimeout(tNum); irNumero(); } });

// ── Busca por produto ───────────────────────────────────────────────────────
const catalogo = D.catalogo.map((p) => ({ c: p.c, n: p.n, k: fold(p.n) + " " + fold(p.c) }));
let tProd = null;
$("qProd").addEventListener("input", () => { clearTimeout(tProd); tProd = setTimeout(buscarProduto, 220); });
function buscarProduto() {
  const q = fold($("qProd").value).trim();
  const termos = q.length >= 2 ? q.split(/\s+/) : [];
  const achados = termos.length ? catalogo.filter((p) => termos.every((t) => p.k.includes(t))) : [];
  state.matched = new Set(achados.map((p) => normCod(p.c)));
  pintar();
  const nl = lojaEstr.filter((e) => e.matched).length, ng = [...galpaoPos.values()].filter((e) => e.matched).length, nb = barPal.filter((e) => e.matched).length;
  $("msg").innerHTML = !termos.length ? "" : !achados.length ? "nenhum produto encontrado"
    : `<b>${achados.length}</b> produto${achados.length > 1 ? "s" : ""} · loja <b>${nl}</b> · galpão <b>${ng}</b> · barracão <b>${nb}</b>`;
  if (state.sel) mostrarCartao(state.sel);
}

// ── Hover e clique ──────────────────────────────────────────────────────────
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $("tip");
const alvosRay = [];
for (const e of lojaEstr) if (e.hit) alvosRay.push(e.hit);
for (const e of galpaoPos.values()) { alvosRay.push(...e.racks); if (e.tile) alvosRay.push(e.tile); }
for (const e of barPal) alvosRay.push(e.bag || e.hit);
let ultimoMouse = null, arrastando = false, moveu = false, down = null;
canvas.addEventListener("pointermove", (ev) => {
  const rc = canvas.getBoundingClientRect();
  ultimoMouse = { x: ev.clientX - rc.left, y: ev.clientY - rc.top };
  mouse.set((ultimoMouse.x / rc.width) * 2 - 1, -(ultimoMouse.y / rc.height) * 2 + 1);
  if (down && Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 4) moveu = true;
  verHover();
});
canvas.addEventListener("pointerleave", () => { tip.style.display = "none"; hoverBox.visible = false; dirty = true; });
canvas.addEventListener("pointerdown", (ev) => { arrastando = true; down = [ev.clientX, ev.clientY]; moveu = false; tip.style.display = "none"; });
window.addEventListener("pointerup", () => { arrastando = false; });
function acharAlvo() { ray.setFromCamera(mouse, camera); const h = ray.intersectObjects(alvosRay, false)[0]; return h ? { e: h.object.userData.alvo, obj: h.object } : null; }
function verHover() {
  if (arrastando) return;
  const a = acharAlvo();
  if (!a) { tip.style.display = "none"; hoverBox.visible = false; canvas.style.cursor = ""; dirty = true; return; }
  canvas.style.cursor = "pointer";
  const e = a.e, d = descrever(e);
  tip.textContent = "";
  const add = (tag, txt, cls) => { const el = document.createElement(tag); el.textContent = txt; if (cls) el.className = cls; tip.appendChild(el); return el; };
  add("b", d.titulo); if (d.sub) add("div", d.sub, "s");
  const linhas = e.area === "galpao" && a.obj.userData.rack ? d.linhas.filter((x) => x.l === "N" + a.obj.userData.rack.o) : d.linhas;
  const ordem = [...linhas].sort((x, y) => (y.m ? 1 : 0) - (x.m ? 1 : 0));
  for (const x of ordem.slice(0, 8)) {
    add("div", `${x.p} — ${x.q == null ? "—" : fmt.format(x.q) + " un"}  (${x.l})`, "li" + (x.m ? " m" : ""));
    if (x.aviso) add("div", x.aviso, "w" + (x.az ? " az" : ""));
  }
  if (linhas.length > 8) add("div", `+ ${linhas.length - 8} (clique para ver todos)`, "s");
  hoverBox.scale.set(e.w + 0.1, Math.max(e.h, 0.3) + 0.05, e.d + 0.1); hoverBox.position.set(e.x, Math.max(e.h, 0.3) / 2, e.z); hoverBox.visible = true;
  tip.style.display = "block";
  const W = $("wrap").clientWidth;
  tip.style.left = Math.min(ultimoMouse.x + 16, W - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.max(ultimoMouse.y - tip.offsetHeight - 12, 6) + "px";
  dirty = true;
}
canvas.addEventListener("click", () => { if (moveu) return; const a = acharAlvo(); if (a) { $("qNum").value = ""; selecionar(a.e, false); } });

// ── Loop ────────────────────────────────────────────────────────────────────
let dirty = true, ultimo = performance.now(), primeiro = true;
controls.addEventListener("change", () => { dirty = true; });
function redimensionar() {
  const w = $("wrap").clientWidth, h = $("wrap").clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (primeiro) { primeiro = false; irVista("tudo", false); }
  dirty = true;
}
new ResizeObserver(redimensionar).observe($("wrap"));
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const tmpV = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - ultimo) / 1000, 0.05); ultimo = now;
  if (tween) {
    const k = Math.min((now - tween.t0) / tween.dur, 1), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t_0, tween.t1, e);
    if (k >= 1) tween = null; dirty = true;
  }
  if (state.bonecos > 0) { andarBonecos(dt); dirty = true; }
  for (const s of nomesPredio) { const vis = camera.position.distanceTo(s.position) > 38; if (s.visible !== vis) { s.visible = vis; dirty = true; } }
  for (const s of rotulos) {
    const d = camera.position.distanceTo(s.getWorldPosition(tmpV));
    const vis = d < s.userData.lod; if (s.visible !== vis) { s.visible = vis; dirty = true; }
    const k = THREE.MathUtils.clamp(d * 0.034, 0.7, 2.4) * s.userData.base;
    if (Math.abs(s.scale.x - k) > 1e-3) { s.scale.set(k, k / 2.4, 1); dirty = true; }
  }
  if (selGrupo.visible) { selFill.material.opacity = 0.28 + 0.14 * Math.sin(now / 280); dirty = true; }
  if (controls.update()) dirty = true;
  if (!dirty) return;
  dirty = false; renderer.render(scene, camera);
}

// ── Início ──────────────────────────────────────────────────────────────────
const nG = lojaEstr.filter((e) => e.it.tipo === "gondola").length, nE = lojaEstr.filter((e) => e.it.tipo === "estante" && e.it.kind !== "balcao").length;
const nOcup = [...galpaoPos.values()].filter((e) => !e.vazia).length, nBags = barPal.filter((e) => e.ocupado).length;
$("stats").innerHTML = `Loja: <b>${nG}</b> gôndolas · <b>${nE}</b> estantes · Galpão: <b>${nOcup}</b>/${G.posicoes.length} posições · Barracão: <b>${nBags}</b>/${barPal.length} paletes`;
redimensionar(); pintar(); aplicarBonecos();
requestAnimationFrame(frame);
window.__geral = { state, lojaEstr, galpaoPos, barPal, D, camera, controls, irVista, selecionar, acharNumero, buscarProduto, scene };
</script>
</body>
