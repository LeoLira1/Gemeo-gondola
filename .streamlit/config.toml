[theme]
base = "light"
primaryColor = "#e87722"
backgroundColor = "#f4f1ea"
secondaryBackgroundColor = "#ebe7dd"
textColor = "#2b2a27"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
# serve static/ em app/static/ (modelos .glb da cena; ver static/modelos/CREDITOS.md)
enableStaticServing = true
